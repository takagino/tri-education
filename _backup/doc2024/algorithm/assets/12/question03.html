    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.js"></script>
    <script>
      let q01 = function (p) {
        let num = 0;

        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          //p.clear();

          if (p.mouseIsPressed && num < 100) {
            p.ellipse(p.mouseX, p.mouseY, num, num);
            num += 1;
          }
        };
      };
      new p5(q01, "q01");

      let q02 = function (p) {
        let num = 0;

        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          //p.clear();

          if (p.mouseIsPressed && num < 100) {
            p.frameCount = 0;
            p.ellipse(p.mouseX, p.mouseY, num, num);
            num += 1;
          }

          if (p.frameCount > 180 && num >= 100) {
            p.clear();
            num = 0;
          }
        };
      };
      new p5(q02, "q02");

      let q03 = function (p) {
        let num = 0;
        let x = [];
        let y = [];
        let d = [];

        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.clear();

          if (p.mouseIsPressed && num < 100) {
            p.frameCount = 0;
            x[num] = p.mouseX;
            y[num] = p.mouseY;
            d[num] = num;
            num += 1;
          }

          for (let i = 0; i < x.length; i += 1) {
            p.ellipse(x[i], y[i], d[i], d[i]);
          }

          p.text(num, 20, p.height - 20);

          if (p.frameCount > 180 && num >= 100) {
            num = 0;
            x = [];
            y = [];
            d = [];
          }
        };
      };
      new p5(q03, "q03");
    </script>
