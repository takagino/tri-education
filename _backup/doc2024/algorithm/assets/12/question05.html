    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.js"></script>
    <script>
      let q01 = function (p) {
        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          //p.clear();
        };

        p.mouseReleased = () => {
          let w = Math.random() * 55 + 5;
          p.ellipse(p.mouseX, p.mouseY, w, w);
        };
      };
      new p5(q01, "q01");

      let q02 = function (p) {
        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          //p.clear();
        };

        p.mouseReleased = () => {
          let w = Math.random() * 55 + 5;

          if (w < 20) {
            p.ellipse(p.mouseX, p.mouseY, w, w);
          } else if (w < 40) {
            p.rect(p.mouseX, p.mouseY, w, w);
          } else {
            p.triangle(
              p.mouseX,
              p.mouseY - w * 0.5,
              p.mouseX - w * 0.5,
              p.mouseY + w * 0.5,
              p.mouseX + w * 0.5,
              p.mouseY + w * 0.5
            );
          }
        };
      };
      new p5(q02, "q02");

      let q03 = function (p) {
        let num = 0;
        const x = [];
        const y = [];
        const d = [];
        const s = [];
        const r = [];

        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.clear();

          for (let i = 0; i < x.length; i += 1) {
            if (r[i] < 0.3) {
              p.ellipse(x[i], y[i], d[i], d[i]);
            } else if (r[i] < 0.6) {
              p.rect(x[i], y[i], d[i], d[i]);
            } else {
              p.triangle(
                x[i],
                y[i] - d[i] * 0.5,
                x[i] - d[i] * 0.5,
                y[i] + d[i] * 0.5,
                x[i] + d[i] * 0.5,
                y[i] + d[i] * 0.5
              );
            }

            d[i] += s[i];
            if (d[i] < 0 || d[i] > 100) {
              s[i] = -s[i];
            }
          }
        };

        p.mouseReleased = () => {
          x[num] = p.mouseX;
          y[num] = p.mouseY;
          d[num] = Math.random() * 55 + 5;
          s[num] = 3;
          r[num] = Math.random();
          num += 1;
        };
      };
      new p5(q03, "q03");
    </script>
