    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.js"></script>
    <script>
      let q01 = function (p) {
        let y = 0;
        let w = 50;
        let speedY = 5;

        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.clear();

          p.ellipse(p.width / 2, y, w, w);

          y += speedY;

          if (y > p.height + w / 2) {
            y = -w / 2;
          }
        };
      };
      new p5(q01, "q01");

      let q02 = function (p) {
        let w = 50;
        let y = w;
        let speedY = 5;

        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.clear();

          p.ellipse(p.width / 2, y, w, w);

          y += speedY;

          if (y < w / 2 || y > p.height - w / 2) {
            speedY = -speedY;
          }
        };
      };
      new p5(q02, "q02");

      let q03 = function (p) {
        let w = 50;
        let y = w;
        let speedY = 5;
        let h = 0;

        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.clear();

          p.ellipse(p.width / 2, y, w, w);
          p.line(0, h, p.width, h);

          y += speedY;

          if (y < h + w / 2 || y > p.height - w / 2) {
            speedY = -speedY;
          }

          if (y > p.height - w / 2 && p.height - h > w) {
            h += 20;
          }
        };
      };
      new p5(q03, "q03");
    </script>
