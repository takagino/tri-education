    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.js"></script>
    <script>
      let q01 = function (p) {
        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.clear();

          p.line(p.width / 2, p.height / 2, p.mouseX, p.mouseY);

          p.fill(180, 50, 50);
          p.ellipse(p.mouseX, p.mouseY, 50, 50);
        };
      };
      new p5(q01, "q01");

      let q02 = function (p) {
        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.clear();

          p.line(p.width / 2, p.height / 2, p.mouseX, p.mouseY);

          const w = p.dist(p.width / 2, p.height / 2, p.mouseX, p.mouseY);
          p.fill(180, 50, 50);
          p.ellipse(p.mouseX, p.mouseY, w, w);
        };
      };
      new p5(q02, "q02");

      let q03 = function (p) {
        let num = 0;
        let w = 0;
        const x = [];
        const y = [];
        const d = [];

        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.clear();

          p.line(p.width / 2, p.height / 2, p.mouseX, p.mouseY);

          w = p.dist(p.width / 2, p.height / 2, p.mouseX, p.mouseY);
          p.fill(180, 50, 50);
          p.ellipse(p.mouseX, p.mouseY, w, w);

          for(let i=0; i<x.length; i+=1){
            p.ellipse(x[i], y[i], d[i], d[i]);
          }
        };

        p.mousePressed = () => {
          x[num] = p.mouseX;
          y[num] = p.mouseY;
          d[num] = w;
          num+=1;
        };
      };
      new p5(q03, "q03");
    </script>
