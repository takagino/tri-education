  <body>
    <header class="l-header">
      <h1 class="l-header__title-sub">「アルゴリズム」座標変換 練習02</h1>
    </header>
    <main class="l-main">
      <article class="chapter">
        <section class="clause">
          <h3 class="clause__title">練習02</h3>
          <div class="item">
            <ol>
              <li>画面の中央から、ランダムな方向・長さの線を描く。</li>
            </ol>
            <div id="q02"></div>
          </div>
          <div class="item">
            <pre
              class="line-numbers"
            ><code class="language-javascript">function setup() {
  createCanvas(400, 400);
  colorMode(HSB);
  rectMode(CENTER);
  angleMode(DEGREES);
}

function draw() {
  translate(width / 2, height / 2);
  rotate(Math.random() * 360);

  line(0, 0, 0, Math.random() * 200);
}</code></pre>
          </div>
        </section>
      </article>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.js"></script>
    <script>
      let q02 = function (p) {
        p.setup = () => {
          p.createCanvas(400, 400);
          p.colorMode(p.HSB);
          p.rectMode(p.CENTER);
          p.angleMode(p.DEGREES);
        };

        p.draw = () => {
          p.translate(p.width / 2, p.height / 2);
          p.rotate(Math.random() * 360);

          p.line(0, 0, 0, Math.random() * 200);
        };
      };
      new p5(q02, "q02");
    </script>
    <!-- syntax highlighter -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/9000.0.1/prism.min.js"></script>
