<!doctype html>
<html dir="ltr" lang="ja">

<head>
  <meta charset="UTF-8">
  <title>「導入教育」ストップウォッチ | 2022年度授業資料</title>
  <meta name="description" content="トライデントコンピュータ専門学校Webデザイン学科講師の高木が作った授業資料">
  <meta name="author" content="horotaka takagi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link href="https://fonts.googleapis.com/css?family=Inconsolata&display=swap" rel="stylesheet">

  <style>
    html {
      overflow-y: scroll;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Inconsolata', monospace, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    p {
      -moz-user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    #info {
      position: absolute;
      top: 10%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      text-decoration: underline;
    }

    #timer {
      font-size: 10rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <p id="info">0人中0人目　目標タイム 00:00:000</p>
    <p id="timer">00:00:000</p>
  </div>
  <script>
    const info = document.getElementById("info");
    const timer = document.getElementById("timer");

    let clickFlag = false;
    let totalNum = 4;
    let currentNum = 0;
    let elapsedTime;
    let startTime;
    let timerId;
    let timeToAdd = 0;
    let windowHeight;

    const init = () => {
      clearTimeout(timerId);
      clickFlag = false;
      currentNum = 0;
      info.textContent = `${totalNum}人中1人目　目標タイム 00:${(60 / totalNum)}:000`;
      elapsedTime = 0;
      timeToAdd = 0;
      updateTimeText();
      // timer.style.transform = "translateY(0)";
      document.body.style.backgroundColor = "#000";
    }

    const updateTimeText = () => {
      let m = Math.floor(elapsedTime / (1000 * 60));
      let s = Math.floor((elapsedTime % (1000 * 60)) / 1000);
      let ms = elapsedTime % 1000;

      // let diff = Math.floor(((windowHeight / 2) / 55) * Math.floor(elapsedTime / 1000));
      // console.log(diff);
      // timer.style.transform = "translateY(" + diff + "px)";

      m = `0${m}`.slice(-2);
      s = `0${s}`.slice(-2);
      ms = `00${ms}`.slice(-3);

      timer.textContent = `${m}:${s}:${ms}`;
    };

    const countUp = () => {
      timerId = setTimeout(() => {
        elapsedTime = Date.now() - startTime + timeToAdd;
        updateTimeText();
        countUp();
      }, 10);
    };

    window.addEventListener('click', () => {
      windowHeight = window.outerHeight;

      if (!clickFlag && currentNum < totalNum) {
        clickFlag = true;
        document.body.style.backgroundColor = "#933";

        currentNum++;
        if (currentNum < totalNum) {
          info.textContent = `${totalNum}人中${currentNum}人目　目標タイム 00:${(60 / totalNum) * currentNum}:000`;
        } else {
          info.textContent = `${totalNum}人中${currentNum}人目　目標タイム 01:00:000`;
        }

        startTime = Date.now();
        countUp();
      } else {
        clickFlag = false;
        document.body.style.backgroundColor = "#000";
        clearTimeout(timerId);
        timeToAdd += Date.now() - startTime;
      }
    });

    window.addEventListener("keyup", event => {
      if (event.isComposing || event.keyCode === 32) {
        init();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      init();
    });

    windowHeight = window.outerHeight;
  </script>
</body>
</html>
