<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.sound</title>
  <style>
    canvas {
      background: #ddd;
      border: 1px solid #aaa;
    }
  </style>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/addons/p5.sound.js"></script>
  <script>
    let mySound;
    let fft;
    let x = 0;
    let y = 0;
    let d = 0;
    let c = 0;

    function preload() {
      mySound = loadSound('ジングルベル〜きよしこの夜.mp3');
    }

    function setup() {
      createCanvas(640,480);
      colorMode(HSL);
      rectMode(CENTER);
      angleMode(DEGREES);
      mySound.amp(0.5);
      fft = new p5.FFT();
      noStroke();
    }

    function draw() {
      clear();
      if (mySound.isPlaying()) {
        let vol = map(mouseY,0,height,0,1);
        vol = constrain(vol,0,1);
        mySound.amp(vol);

        let data = fft.analyze();
        console.log(data);
        textSize(12 + (mouseY / width) * 72);
        text("Merry X'mas",50,250);

        // for (let i = 0; i < waveform.length; i++) {
        //   let x = map(i,0,waveform.length,0,width);
        //   let h = map(waveform[i],-1,1,0,height);
        //   line(x,0,x,h);
        // }

        x = 0;
        y = 0;
        c = floor(random(0,100));
        d = floor(random(10,100));

        for (let i = 0; i < data.length; i++) {
          let c = map(data[i],0,255,0,360);
          fill(c,50,50,0.3);
          ellipse(320,240,data[i],min(data[i]));

          let x = map(data[i],min(data),max(data),0,480);
          let r = map(data[i],min(data),max(data),0,360);
          translate(x,x);
          rotate(r);
          fill(180,50,c,0.3);
          rect(x,y,d,d);
        }

        // for (let i = 0; i < waveform.length; i++) {
        //   let x = map(waveform[i],min(waveform),max(waveform),0,480);
        //   let r = map(waveform[i],min(waveform),max(waveform),0,360);

        //   translate(x,x);
        //   rotate(r);
        //   x = 0;
        //   y = 0;
        //   c = floor(random(0,100));
        //   d = floor(random(10,100));

        //   fill(180,50,c,0.3);
        //   rect(x,y,d,d);
        // }
      }
    }

    function keyPressed() {
      mySound.loop();
    }

    function keyReleased() {
      mySound.pause();
      clear();
    }

  </script>
</body>

</html>
