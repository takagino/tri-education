<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {
            background: #111;
            border: 1px solid #333;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/addons/p5.sound.js"></script>
    <script>
        let mySound;
        let fft;

        function preload() {
            mySound = loadSound('Dimension_Warp.mp3');
        }

        function setup() {
            createCanvas(640, 640);
            colorMode(HSL);
            angleMode(DEGREES);
            fft = new p5.FFT();
        }

        function draw() {
            background(0);
            translate(width / 2, height / 2);

            if (mySound.isPlaying()) {
                let waveform = fft.waveform();
                let vol = map(mouseY, 0, height, 0, 1);
                vol = constrain(vol, 0, 1);
                mySound.amp(vol);

                let color = map(vol, 0, 1, 200, 360);
                let size = map(vol, 0, 1, 100, 300);

                noFill();
                stroke(color, 100, 50);

                for (let i = 0; i < waveform.length - 1; i++) {
                    let m = map(i, 0, waveform.length, 0, 360);
                    let n = size + waveform[i] * 90;
                    let z = n * cos(m);
                    let j = n * sin(m);

                    let c2 = map(i + 1, 0, waveform.length, 0, 360);
                    let d2 = size + waveform[i + 1] * 90;
                    let x2 = d2 * cos(c2);
                    let y2 = d2 * sin(c2);

                    line(z, j, x2, y2);
                }
            }
        }

        function keyPressed() {
            if (!mySound.isPlaying()) {
                mySound.loop();
            }
        }

        function keyReleased() {
            mySound.pause();
        }
    </script>
</body>

</html>
