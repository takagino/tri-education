<!DOCTYPE html>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p5.sound</title>
    <style>
      canvas {
        background: #fff;
        border: 1px solid #aaa;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/addons/p5.sound.js"></script>
    <script>
      let mySound;
      let fft;

      function preload() {
        mySound = loadSound("BGM.mp3");
      }

      function setup() {
        createCanvas(640, 480);
        colorMode(HSL);
        rectMode(CENTER);
        noStroke();

        fft = new p5.FFT();
      }

      function draw() {
        mySound.amp(map(mouseY, 0, height, 0, 1));

        if (mySound.isPlaying()) {
          let spectrum = fft.analyze();

          for (let i = 0; i < spectrum.length; i += 50) {
            let hue = random(200, 280); // 青〜紫の範囲で色相をランダムに設定
            fill(hue, 80, 60, 0.1);
            let h = random(10, 150); // 20〜100のランダムな大きさ
            circle(random(width), random(height), h);
          }
        }
      }

      function keyPressed() {
        mySound.loop();
      }

      function keyReleased() {
        mySound.pause();
      }
