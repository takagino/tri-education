<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {
            background: #111;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/addons/p5.sound.js"></script>
    <script>
        let mySound;
        let fft;
        let x = 0;
        let y = 0;
        let d = 0;
        let c = 0;

        function preload() {
            mySound = loadSound('251_BPM150.mp3   ');
        }

        function setup() {
            createCanvas(640, 480);
            colorMode(HSL);
            rectMode(CENTER);
            angleMode(DEGREES);
            mySound.amp(0.5);
            noStroke(),
                fft = new p5.FFT();
        }

        function draw() {
            clear();
            if (mySound.isPlaying()) {
                let vol = map(mouseY, 0, height, 0, 1);
                vol = constrain(vol, 0, 1);
                mySound.amp(vol);

                let waveform = fft.analyze();
                console.log(waveform);

                // for (let i = 0; i < waveform.length; i++) {
                //     let x = map(i, 0, waveform.length, 0, width);
                //     let h = map(waveform[i], -1, 1, 0, height);
                //     line(x, 0, x, h);
                // }

                for (let i = 0; i < waveform.length; i++) {
                    fill(map(waveform[i], min(waveform), max(waveform), 0, 360), 50, 50, 0.2);
                    let h = map(waveform[i], min(waveform), max(waveform), 0, 200);
                    triangle(0, 0, waveform[i] * 0.5, 500, waveform[i] * 5, 1000);

                    // let x = map(waveform[i], min(waveform), max(waveform), 0, 480);
                    // translate(x, x);
                    // rotate(random(0, 360));
                    // x = 0;
                    // y = 0;
                    // c = floor(random(0, 100));
                    // d = floor(random(10, 100));

                    // fill(180, 50, c, 0.3);
                    // rect(x, y, d, d);
                }
            }
        }

        function keyPressed() {
            mySound.loop();
        }

        function keyReleased() {
            mySound.pause();
            clear();
        }         </script>
</body>

</html>
