<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {
            background: #000;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/addons/p5.sound.js"></script>
    <script>
        let mySound;
        let fft;


        function preload() {
            mySound = loadSound('groove.mp3');
        }

        function setup() {
            createCanvas(640, 480);
            colorMode(HSL);
            rectMode(CENTER);
            angleMode(DEGREES);
            mySound.amp(0.5);
            fft = new p5.FFT();

        }

        function draw() {
            clear();

            mySound.amp(map(mouseY, 0, height, 0, 1));

            if (mySound.isPlaying()) {
                let vol = map(mouseY, 0, height, 0, 1);
                vol = constrain(vol, 0, 1);
                mySound.amp(vol);

                let data = fft.analyze();
                console.log(data);

                for (let i = 0; i < data.length; i++) {
                    let c = map(data[i], 0, 255, 0, 360);
                    let d = map(data[i], 0, 100, 0, 100);
                    fill(c, c, 60, 0.3);
                    rect(500, 30, d, 20);
                    rect(d, 100, d, d);
                    rect(100, 400, 100, d);
                    rect(100, 300, d, 10);

                    // rect(d, 200, d, 30);
                    rect(500, 400, d, d);
                }
            }
        }

        function keyPressed() {
            mySound.loop();
        }

        function keyReleased() {
            mySound.pause();
            clear();
        }
    </script>
</body>

</html>
