<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {
            background: #ddd;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/addons/p5.sound.js"></script>
    <script>
        let mySound;
        let fft;
        let angleOffset = 0;

        function preload() {
            mySound = loadSound('videoplayback.mp4');
        }

        function setup() {
            createCanvas(640, 480);
            colorMode(HSL);
            rectMode(CENTER);
            angleMode(DEGREES);
            mySound.amp(0.5);
            fft = new p5.FFT();
            noStroke();
        }

        function draw() {
            clear();
            background(0, 0.2);

            if (mySound.isPlaying()) {
                // 音量をマウス位置で調整
                let vol = map(mouseY, 0, height, 0, 1);
                vol = constrain(vol, 0, 1);
                mySound.amp(vol);

                // FFTで周波数データを取得
                let spectrum = fft.analyze();

                // ランダムに球体を配置
                for (let i = 0; i < spectrum.length; i += 10) {
                    let size = map(spectrum[i], 0, 255, 10, 100); // 球体のサイズ
                    let x = random(width); // ランダムなX座標
                    let y = random(height); // ランダムなY座標
                    let hue = map(spectrum[i], 0, 255, 0, 360); // 色相を周波数に対応
                    fill(hue, 80, 50, 0.5); // 色と透明度
                    ellipse(x, y, size, size); // 球体を描画
                }

                // 徐々に回転させる
                angleOffset += 0.5;
            }
        }

        function keyPressed() {
            mySound.loop();
        }

        function keyReleased() {
            mySound.pause();
            clear();
        }




    </script>
</body>

</html>
