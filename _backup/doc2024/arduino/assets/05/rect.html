<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.sound</title>
  <style>
    canvas {
      background: #ddd;
      border: 1px solid #aaa;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/addons/p5.sound.js"></script>
  <script>
    let mySound;
    let x = 0;
    let y = 0;
    let d = 0;
    let c = 0;

    function preload() {
      mySound = loadSound('groove.mp3');
    }

    function setup() {
      createCanvas(640, 480);
      colorMode(HSL);
      rectMode(CENTER);
      angleMode(DEGREES);
      mySound.amp(0.5);
    }

    function draw() {
      if (mySound.isPlaying()) {
        let vol = map(mouseY, 0, height, 0, 1);
        vol = constrain(vol, 0, 1);
        mySound.amp(vol);

        translate(random(0, width), random(0, height));
        rotate(random(0, 360));
        x = 0;
        y = 0;
        c = floor(random(0, 100));
        d = floor(random(10, 100));

        fill(180, 50, c, 0.3);
        rect(x, y, d, d);
      }
    }

    function keyPressed() {
      mySound.loop();
    }

    function keyReleased() {
      mySound.pause();
      clear();
    }
  </script>
</body>
</html>
