<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>線の長さで表現する</title>
  <style>
    canvas {
      background: #000;
      border: 1px solid #aaa;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.5.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.5.0/addons/p5.sound.js"></script>
  <script>
    let mySound;
    let fft;

    function preload() {
      mySound = loadSound('power.mp3');
    }

    function setup() {
      createCanvas(640, 480);
      colorMode(HSL);
      angleMode(DEGREES);
      stroke(255);

      fft = new p5.FFT();
    }

    function draw() {
      clear();
      mySound.amp(map(mouseY, 0, height, 0, 1));

      if (mySound.isPlaying()) {
        let spectrum = fft.analyze();
        console.log(spectrum);
        let angle = 360 / spectrum.length;

        push();
        translate(width / 2, height / 2);
        for (let i = 0; i < spectrum.length; i++) {
          rotate(angle);
          let h = map(spectrum[i], min(spectrum), max(spectrum), 0, height / 2);
          line(0, 0, 0, h);
        }
        pop();
      }
    }

    function keyPressed() {
      mySound.loop();
    }

    function keyReleased() {
      mySound.pause();
    }
  </script>
</body>
</html>
