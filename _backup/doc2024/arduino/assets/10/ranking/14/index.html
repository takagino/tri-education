<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        h1 {
            font-family: 'Times New Roman', Times, serif;
            width: 640px;
            margin: 20px auto 30px;
        }

        svg {
            background-color: #fff;
            border: 1px #000 solid;
            padding: 20px;
        }

        #container {
            width: 640px;
            margin: auto;
        }

        .reference {
            width: 640px;
            margin: 50px auto;
        }
    </style>
</head>

<body>
    <h1>人気猫種ランキングTOP5</h1>
    <div id="container">
        <!-- <ul>
            <li>リストです。</li>
            <li>リストです。</li>
        </ul> -->
    </div>
    <p class="reference">参考：https://prtimes.jp/main/html/rd/p/000000139.000028421.html</p>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const width = 640;
        const height = 500;
        d3.json("./data.json")
            .then((dataset) => {
                const max = d3.max(dataset, (data) => data.val);
                const min = d3.min(dataset, (data) => data.val);
                console.log(max, min);

                const scale = d3.scaleLinear()
                    .domain([0, max]) /* 変数に変更する */
                    .range([0, 400]);

                //svg要素を生成
                const svg = d3.create("svg")
                    .attr("viewBox", `0 0 ${width} ${height}`);

                const g = svg.selectAll(".item")
                    .data(dataset)
                    .enter()
                    .append("g")
                    .classed("item", true)
                    .attr("transform", (data, index) => `translate(0, ${index * 30})`);

                //要素で指定する場合
                g.append("rect")
                    .attr("x", 120)
                    .attr("y", (data) => data.img + 40)
                    .attr("width", 0)
                    .attr("height", 20)
                    .attr('fill', (data) => data.color)
                    .transition() /* アニメーションの設定を開始する合図 */
                    .duration(1000) /*何秒かけてアニメーションするか */
                    .delay((data) => data.dilay) /*何秒遅らせるか */
                    .ease(d3.easePolyInOut) /*イージングの種類 */
                    .attr("width", (data) => scale(data.val)); /* アニメーション終了時の値 */


                //クラス名で指定する場合
                g.append("text")
                    .classed("label", true)
                    .attr("font-size", "14")
                    .attr("x", 120)
                    .attr("y", (data) => data.img + 20)
                    .text((data) => data.label);

                g.append("text")
                    .classed("val", true)
                    .attr("font-size", "14")
                    .attr("x", 120)
                    .attr("y", (data) => data.img + 55)
                    .text((data) => data.val)
                    .transition() /* アニメーションの設定を開始する合図 */
                    .duration(1000) /*何秒かけてアニメーションするか */
                    .delay((data) => data.dilay) /*何秒遅らせるか */
                    .ease(d3.easePolyInOut) /*イージングの種類 */
                    .attr("x", (data) => scale(data.val) + 130); /* アニメーション終了時の値 */

                g.append("image")
                    .attr("href", (data) => data.url)
                    .attr("width", 100)
                    .attr("height", 70)
                    .attr("x", 14)
                    .attr("y", (data) => data.img)

                //id名「container」の要素にsvgを追加
                container.append(svg.node());
                console.log(dataset);
            })
            .catch((error) => {
            });

    </script>
</body>

</html>
