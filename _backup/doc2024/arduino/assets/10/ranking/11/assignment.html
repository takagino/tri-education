<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>d3.js</title>
  <style>
    svg {
      /* background: url(/ダウンロード.jpeg) center right no-repeat; */
      margin-top: 50px;
      margin-left: 300px;
    }

    body {
      background-color: #01623f;
      margin: 0 auto;
      text-align: center;
      color: #fff;
    }

    h1 {
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      margin-left: -300px;
      margin-right: 250px;
    }

    text.title {
      font-family: 'Times New Roman', Times, serif;
    }

    img {
      width: 100px;
      margin: 0 auto;
    }

    .flex {
      display: flex;
      margin: 20px auto;
    }
  </style>
</head>

<body>
  <div class="flex">
    <img src="/ダウンロード.jpeg" alt="">
    <h1>"Mrs.GREEN APPLE" MV再生回数ランキング</h1>
  </div>
  <div id="container">

  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>

    const width = 640;
    const height = 600;
    const svg = d3.create("svg")
      .attr("viewBox",`0 0 ${width} ${height}`);
    const imageW = 70;

    d3.json("./data1.json")
      .then((dataset) => {

        const max = d3.max(dataset,(data) => data.val);
        const min = d3.min(dataset,(data) => data.val);
        console.log(max,min);


        const scale = d3.scaleLinear()
          .domain([0,max])
          .range([0,400]);
        const g = svg.selectAll(".item")
          .data(dataset)
          .enter()
          .append("g")
          .classed("item",true)
          .attr("transform",(data,index) => `translate(20, ${index * 90})`);

        // const svg = d3.create("svg")
        //   .attr("width",width)
        //   .attr("height",height);

        svg.selectAll('rect')
          .data(dataset)
          .enter()
          .append("rect")
          .attr("x",imageW + 100)
          .attr("y",(data,index) => index * 90 + 20)
          .attr("width",0)
          .attr("height",15)
          .attr('fill',(data) => data.color)
          .transition()
          .duration(1000)
          .delay((data,index) => index * 200)
          .ease(d3.easeCircleInOut)
          .attr("width",(data) => data.num)


        svg.selectAll('.title')
          .data(dataset)
          .enter()
          .append("text")
          .classed("title",true)
          .attr("font-size","12")
          .attr("x",1000)
          .attr("y",(data,index) => index * 90 + 14)
          .text((data,index) => `${index + 1}位 ${data.title}`)
          .attr('fill',(data) => data.color)
          .transition()
          .duration(1000)
          .delay((data,index) => index * 200)
          .ease(d3.easeLinear)
          .attr("x",imageW + 100)

        svg.selectAll('.num')
          .data(dataset)
          .enter()
          .append("text")
          .classed("num",true)
          .attr("font-size","25")
          .attr("x",(data) => data.num + imageW + 100)
          .attr("y",(data,index) => index * 90 + 35)
          .text((data) => `${data.num / 100}億回数`)
          .attr('fill',(data) => data.color)
          .transition()
          .duration(1000)
          .delay((data,index) => index * 200)
          .ease(d3.easeLinear)
          .attr("font-size","12");


        g.append("image")
          .attr("href",(data) => data.url)
          .attr("width",imageW)

        container.append(svg.node());
      })
      .catch((error) => {
      });



  </script>
</body>

</html>
