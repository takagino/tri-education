<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>d3.js</title>
    <style>
      svg {
        border: 3px solid #003fbe;
        background-color: #ffffff;
      }

      #container {
        margin: auto;
      }

      h1 {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>一日の乗り降り者数ランキング!!!!</h1>

    <button id="start">グラフを表示</button>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      d3.json("./data.json")
        .then((dataset) => {
          if (!dataset || dataset.length === 0) {
            console.error("データが空です。");
            return;
          }

          const padding = 20;
          const max = d3.max(dataset, (data) => data.passengers);

          const scale = d3.scaleLinear().domain([0, max]).range([0, 300]);

          const svg = d3
            .select("#container")
            .append("svg")
            .attr("viewBox", "0 0 500 500")
            .attr("width", 500)
            .attr("height", 500);

          const g = svg
            .selectAll(".item")
            .data(dataset)
            .enter()
            .append("g")
            .classed("item", true)
            .attr(
              "transform",
              (data, index) => `translate(${padding},${index * 90 + padding})`
            );

          g.append("rect")
            .attr("width", 0)
            .attr("height", 20)
            .attr("x", 110)
            .attr("y", 35)
            .attr("fill", (data) => data.color);

          g.append("text")
            .classed("label", true)
            .text((data) => data.station)
            .attr("font-size", "14px")
            .attr("x", 110)
            .attr("y", 20);

          g.append("text")
            .classed("label", true)
            .text((data) => "(" + data.prefecture + ")")
            .attr("font-size", "10px")
            .attr("font-weight", "bold")
            .attr("x", 170)
            .attr("y", 20);

          g.append("text")
            .classed("val", true)
            .text((data) => data.passengers + "人")
            .attr("font-size", "14px")
            .attr("x", 110)
            .attr("y", 50)
            .attr("font-weight", "bold");

          g.append("image")
            .attr("href", (data) => data.url)
            .attr("width", 0)
            .attr("height", 0)
            .transition()
            .duration(1000)
            .delay((data, index) => index * 600)
            .ease(d3.easeQuadOut)
            .attr("x", 10)
            .attr("width", 80)
            .attr("height", 60);

          const startBtn = document.querySelector("#start");
          startBtn.addEventListener("click", () => {
            g.select("rect")
              .transition()
              .duration(1000)
              .delay((data, index) => index * 500)
              .ease(d3.easeExpIn)
              .attr("width", (data) => scale(data.passengers));
          });
        })
        .catch((error) => console.error("データの読み込みエラー:", error));
    </script>
  </body>
</html>
