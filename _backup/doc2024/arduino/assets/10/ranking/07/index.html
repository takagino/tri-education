<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アニメTOP5</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 30px;
        }

        svg {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #start {
            margin: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #start:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">おすすめアニメ TOP5</div>
        <button id="start">アニメのランキングを表示</button>
        <script src="https://d3js.org/d3.v6.min.js"></script>
        <script>
            d3.json("./data.json")
                .then((dataset) => {
                    const padding = 20;
                    const barHeight = 60;  // バーの高さ
                    const spacing = 30;    // バーの間隔

                    const max = d3.max(dataset, (data) => data.val);

                    // 画面幅を基準にバーの最大幅を決定
                    const svgWidth = window.innerWidth - 40;
                    const svgHeight = dataset.length * (barHeight + spacing) + padding * 2;

                    // 画面幅に収まるようにスケーリングを調整
                    const scale = d3.scaleLinear()
                        .domain([0, max])
                        .range([0, svgWidth - 160]);

                    const svg = d3.select(".container")
                        .append("svg")
                        .attr("width", svgWidth)
                        .attr("height", svgHeight)
                        .attr("viewBox", `0 0 ${svgWidth} ${svgHeight}`);

                    const colors = {
                        "推しの子": "#ff69b4",
                        "新米オッサン冒険者": "#32cd32",
                        "俺は全てをパリイする": "#1e90ff",
                        "〈物語〉シリーズ": "#ff4500",
                        "隣のアーリャさん": "#8a2be2"
                    };

                    const g = svg.selectAll(".item")
                        .data(dataset)
                        .enter()
                        .append("g")
                        .classed("item", true)
                        .attr("transform", (data, index) => `translate(${padding},${index * (barHeight + spacing) + padding})`);

                    // 画像を表示
                    g.append("image")
                        .attr("href", (data) => data.url)
                        .attr("width", 120)
                        .attr("height", barHeight)
                        .attr("x", 0)
                        .attr("y", 0);

                    // ラベルを表示
                    g.append("text")
                        .classed("label", true)
                        .text((data) => data.label)
                        .attr("font-size", "18px")
                        .attr("x", 150)
                        .attr("y", -5);

                    // 初期状態でバーを幅0にしておく
                    const rect = g
                        .append("rect")
                        .attr("x", 150)
                        .attr("y", 0)
                        .attr("width", 0)
                        .attr("height", barHeight)
                        .attr("fill", (data) => colors[data.label] || "#4682b4");

                    // 数字の位置を決めるためにテキストを追加
                    const valText = g.append("text")
                        .classed("val", true)
                        .text((data) => data.val)
                        .attr("font-size", "18px")
                        .attr("x", 150)
                        .attr("y", barHeight / 2 + 5);

                    // ボタンのクリックイベント
                    const startBtn = document.querySelector("#start");
                    startBtn.addEventListener("click", () => {
                        // アニメーションでバーの幅を設定
                        rect
                            .transition()
                            .duration(1000)
                            .delay((data, index) => index * 200)
                            .ease(d3.easeBounceIn)
                            .attr("width", (data) => scale(data.val));

                        // 数字もバーの幅に合わせて移動
                        valText
                            .transition()
                            .duration(1000)
                            .delay((data, index) => index * 180)
                            .ease(d3.easeBounceIn)
                            .attr("x", (data) => 50 + scale(data.val));
                    });
                })
                .catch((error) => {
                    console.error(error);
                });
        </script>
    </div>
</body>

</html>
