<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        html {
            background-color: #ddd;
            text-align: center;
        }

        text {
            color: #484848;
        }

        svg {
            background-color: #ddd;
        }

        #container {
            max-width: 640;
            margin: auto;
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        d3.select("#container").append("h1").text("にじさんじ歌ってみた・オリジナル曲再生数ランキング").style("color", "#484848");
        const width = 1000;
        const height = 480;
        const imageW = 100;
        //svg要素を生成
        const svg = d3.create("svg")
            .attr("viewBox", `0 0 ${width} ${height}`);



        d3.json("./data.json")
            .then((dataset) => {

                /*
                読み込んだJSONデータの値から、最大値（d3.max）と最小値（d3.min）を取得
                */
                const max = d3.max(dataset, (data) => data.val);
                const min = d3.min(dataset, (data) => data.val);
                console.log(max, min);
                /*
                    domain()で変換前の範囲を、range()で変換後の範囲を指定する  グラフの差が少ないときとかの調整
                    変換した範囲を変数「scale」に代入しておく
                        */
                const scale = d3.scaleLinear()
                    .domain([0, max])
                    .range([0, 400]);

                /*
                g要素の追加
                ※複数出てくる可能性が高いのでクラス名で指定する癖をつけると良い
                */
                const g = svg.selectAll(".item")//まとめて制御するのである前提で一旦クラス名で制御
                    .data(dataset)
                    .enter()
                    .append("g")//g要素の追加
                    .classed("item", true)//クラス名を追加
                    //.attr("y", (data, index) => index * 30);//yをグループでまとめて移動（※これだけでは変わらないので↓）
                    /* attr("transform", (data, index) => "translate(0, 30)");
                    attr("transform", (data, index) => "translate(0, 60)");
                    attr("transform", (data, index) => "translate(0, 90)");*/
                    //                                             ↓x座標　　↓y座標
                    .attr("transform", (data, index) => `translate(200, ${index * 100 + 20})`);//全体的にgごと動かす

                /*
                rect要素の修正
                1. svg要素ではなく、g要素に追加（append）する。
                2. データの照合はすでに終わっているので、いきなり追加して良い。
                */

                //要素で指定する場合
                g.append("rect")//gのなかに追加
                    .attr("x", imageW + 20)
                    .attr("y", 40)
                    //.attr("width", (data) => data.val)/* 設定したscaleで値をキャストする */
                    .attr("width", 0)
                    .attr("height", 15)
                    .attr("fill", (data) => data.color)
                    .transition() /* アニメーションの設定を開始する合図 */
                    .duration(1000) /*何秒かけてアニメーションするか 1000=1秒 */
                    .delay((data, index) => index * 200) /*何秒遅らせるか */
                    .ease(d3.easeCubicOut) /*イージングの種類 */
                    .attr("width", (data) => scale(data.val));/*scale適用後*/

                g.append("text")
                    .classed("name", true)
                    .attr("font-size", "14")
                    // .attr("x", (data) => data.val + imageW+20)/* 設定したscaleで値をキャストする */
                    .attr("x", imageW + 20)
                    .attr("y", 14)
                    .attr("fill", (data) => data.color)
                    .text((data) => data.name)


                //クラス名で指定する場合
                g.append("text")
                    .classed("value", true)
                    .attr("font-size", "14")
                    // .attr("x", (data) => data.val + imageW+20)/* 設定したscaleで値をキャストする */
                    .attr("x", 0)
                    .attr("y", 14 + 40)
                    .text((data) => `${data.val}回`)
                    .transition() /* アニメーションの設定を開始する合図 */
                    .duration(1000) /*何秒かけてアニメーションするか 1000=1秒 */
                    .delay((data, index) => index * 200) /*何秒遅らせるか */
                    .ease(d3.easeCubicOut) /*イージングの種類 */
                    .attr("x", (data) => scale(data.val) + imageW + 25);/* scale適用後 */



                g.append("text")
                    .classed("label", true)
                    .attr("font-size", "0")
                    .attr("x", imageW + 20)
                    .attr("y", 14 + 35)
                    .text((data) => data.label)
                    .transition()
                    .duration(1000)
                    .ease(d3.easeCubicOut)
                    .attr("font-size", "22");

                g.append("image")//svgなのでimage要素
                    .attr("href", (data) => data.url)//svgなのでhref urlという名前でdatasetにあるので取り出す
                    .attr("width", imageW);


                //id名「container」の要素にsvgを追加
                container.append(svg.node());

            })
            .catch((error) => {
            });



    </script>
</body>

</html>
