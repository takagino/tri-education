<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カラオケでよく歌われたランキング</title>
    <style>
        svg {
            background-color: #ddd;
        }

        #container {
            max-width: 640px;
            margin: auto;
        }

        .item {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>

        const width = 640;
        const height = 480;
        const imageW = 100;
        const svg = d3.create("svg")
            .attr("viewBox", `0 0 ${width} ${height}`);

        d3.json("./karaoke.json")
            .then((dataset) => {

                const max = d3.max(dataset, (data) => data.val);
                const scale = d3.scaleLinear().domain([0, max]).
                    range([0, 400]);

                const g = svg
                    .selectAll(".item").data(dataset)
                    .enter()
                    .append("g")
                    .classed("item", true)
                    .attr("transform", (data, index) => `translate(20, ${index * 120 + 20})`); // Adjust spacing


                g.append("rect")
                    .attr("x", imageW + 20)
                    .attr("y", 0)
                    .attr("width", 0)
                    .attr("height", 20)
                    .attr("fill", (data) => data.color)
                    .transition()
                    .duration(1000)
                    .delay(500)
                    .ease(d3.easeLinear)
                    .attr("width", (data) => scale(data.val));

                g.append("text")
                    .classed("label", true)
                    .attr("font-size", "14")
                    .attr("x", 0)
                    .attr("y", 14)
                    .text((data) => data.label)
                    .transition()
                    .duration(1000)
                    .delay((data, index) => index * 200)
                    .ease(d3.easeLinear)
                    .attr("fill", "#FE347E")
                    .attr("x", (data) => scale(data.val));

                g.append("text")
                    .classed("value", true)
                    .attr("font-size", "0")
                    .attr("x", imageW + 20)
                    .attr("y", 14)
                    .text((data) => data.val)
                    .attr("fill", "#FE347E")
                    .attr("font-size", "30");

                g.append("image")
                    .attr("href", (data) => data.url)
                    .attr("width", imageW)
                    .attr("y", 30); // Add spacing below title and graph

                container.append(svg.node());
            })
            .catch((error) => { console.error(error); });
    </script>
</body>

</html>
