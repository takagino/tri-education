<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>d3.js</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        svg {
            background-color: #333;
            border: 1px solid #555;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <h1>好きなYoutuber</h1>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script>
        d3.json("./data.json").then((dataset) => {
            const padding = 2;  // Even smaller padding
            const max = d3.max(dataset, (data) => data.val);
            const scale = d3.scaleLinear().domain([0, max]).range([0, 80]);  // Even smaller scale range
            const svg = d3.select("body").append("svg").attr("viewBox", "0 0 200 100");  // Smaller viewBox
            const g = svg.selectAll(".item").data(dataset).enter().append("g").classed("item", true).attr("transform", (data, index) => `translate(${padding},${index * 20 + padding})`);

            g.append("rect")
                .attr("width", 0)
                .attr("height", 5)  // Even smaller height
                .attr("x", 40)
                .attr("y", 3)
                .attr("fill", (data) => data.color)
                .style("stroke", "#fff")
                .style("stroke-width", 0.5)
                .transition()
                .duration(800)
                .delay((data, index) => index * 300)  // Reduced delay
                .ease(d3.easeBounceOut)
                .attr("width", (data) => scale(data.val));

            g.append("text")
                .text((data) => data.label)
                .attr("font-size", "4px")  // Much smaller font size
                .attr("font-weight", "bold")
                .attr("x", 40)
                .attr("y", 2)
                .style("fill", "#fff")
                .style("opacity", 0)
                .transition()
                .duration(600)
                .delay((data, index) => index * 300)
                .style("opacity", 1);

            g.append("text")
                .text((data) => data.val)
                .attr("font-size", "3px")  // Much smaller font size for number
                .attr("font-weight", "bold")
                .attr("x", 22)
                .attr("y", 7)
                .style("fill", "#ff0")
                .style("opacity", 3)
                .transition()
                .duration(1000)
                .delay((data, index) => index * 200)
                .ease(d3.easeElasticOut)
                .style("opacity", 1)
                .attr("x", (data) => 40 + scale(data.val) + 4);

            g.append("image")
                .attr("href", (data) => data.url)
                .attr("x", 1)
                .attr("y", 1)
                .attr("width", 22)  // Even smaller image width
                .attr("height", 15)  // Even smaller image height
                .style("opacity", 0)
                .style("transform", "scale(0.2)")  // Even smaller scale
                .transition()
                .duration(600)
                .delay((data, index) => index * 300)
                .style("opacity", 1)
                .style("transform", "scale(1)");

            g.append("circle")
                .attr("cx", (data) => 40 + scale(data.val))
                .attr("cy", 5.4)
                .attr("r", 1.5)  // Much smaller circle radius
                .style("fill", (data) => data.color)
                .style("stroke", "#fff")
                .style("stroke-width", 0.5)
                .transition()
                .duration(600)
                .delay((data, index) => index * 300 + 300)
                .ease(d3.easeCubicOut)
                .attr("r", 2.5);  // Even smaller radius
        }).catch((error) => { });
    </script>
</body>

</html>
