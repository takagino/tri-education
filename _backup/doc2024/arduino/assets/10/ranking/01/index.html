<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        h1 {
            text-align: center;
            margin-left: auto;
            margin-right: auto;
            color: #fff;
        }

        body {
            background-color: #402701;
        }

        svg {
            background-color: #edd7b7;
        }

        #container {
            max-width: 640px;
            margin: auto;
        }
    </style>
</head>

<body>
    <h1>国内のワンちゃん種類別飼育数ランキング</h1>
    <div id="container">

    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>

        const width = 640;
        const height = 500;
        const imageW = 100;


        d3.json("./data.json")
            .then((dataset) => {

                const svg = d3.create("svg")
                    .attr("viewBox", `0 0 ${width} ${height}`);

                const max = d3.max(dataset, (data) => data.val);
                const min = d3.min(dataset, (data) => data.val);
                console.log(max, min);

                const scale = d3.scaleLinear()
                    .domain([0, max])
                    .range([0, 400]);

                const g = svg
                    .selectAll(".item")
                    .data(dataset)
                    .enter()
                    .append("g")
                    .classed("item", true)
                    .attr("transform", (data, index) => `translate(20, ${index * 100 + 20})`);

                //要素で指定する場合
                g.append("rect")
                    .attr("x", imageW + 40)
                    .attr("y", 0)
                    .attr("width", 0)
                    .attr("height", 20)
                    .attr("fill", (data) => data.color)
                    .transition()
                    .duration(1000)
                    .delay((data, index) => index * 1000)
                    .ease(d3.easeBounceOut)
                    .attr("width", (data) => scale(data.val));

                //クラス名で指定する場合
                g.append("text")
                    .classed("label", true)
                    .attr("font-size", "14")
                    .attr("x", 0)
                    .attr("y", 14)
                    .text((data) => data.label)
                    .transition()
                    .duration(1000)
                    .delay((data, index) => index * 1200)
                    .ease(d3.easeBounceOut)
                    .attr("x", (data) => scale(data.val) + imageW + 50);

                g.append("text")
                    .classed("value", true)
                    .attr("font-size", "14")
                    .attr("x", 0)
                    .attr("y", 14)
                    .text((data) => data.val + "万匹")
                    .transition()
                    .duration(1000)
                    .delay((data, index) => index * 1200)
                    .ease(d3.easeBounceOut)
                    .attr("x", imageW + 40);

                g.append("text")
                    .classed("value", true)
                    .attr("font-size", "14")
                    .attr("font-weight", "bold")
                    .attr("x", 0)
                    .attr("y", 30)
                    .text((data) => data.rank)
                    .transition()
                    .duration(1000)
                    .delay((data, index) => index * 1200)
                    .ease(d3.easeBounceOut);

                g.append("image")
                    .attr("href", (data) => data.url)
                    .attr("width", imageW)
                    .attr("x", 0)
                    .transition()
                    .duration(1200)
                    .delay((data, index) => index * 1000)
                    .attr("x", 20);

                //id名「container」の要素にsvgを追加
                container.append(svg.node());
            })
            .catch((error) => { });
    </script>
</body>

</html>
