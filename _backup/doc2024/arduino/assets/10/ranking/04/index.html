<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&display=swap"
      rel="stylesheet"
    />
    <title>d3.js</title>
    <style>
      h1 {
        text-align: center;
      }

      body {
        font-family: "Kiwi Maru", serif;
        font-weight: 400;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div id="container"><h1>初週売上ランキング(万枚)</h1></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      const width = 640;
      const height = 800;
      const imageW = 100;
      const spacing = 140;

      d3.json("./data.json")
        .then((dataset) => {
          const svg = d3
            .create("svg")
            .attr("viewBox", `0 0 ${width} ${height}`);

          const max = d3.max(dataset, (data) => data.val);
          const min = d3.min(dataset, (data) => data.val);
          console.log(max, min);

          const scale = d3
            .scaleLinear()
            .domain([0, max]) /* 変数に変更する */
            .range([0, 400]);

          const g = svg
            .selectAll(".item")
            .data(dataset)
            .enter()
            .append("g")
            .classed("item", true)
            .attr(
              "transform",
              (data, index) => `translate(20, ${index * spacing + 20})`
            );

          //要素で指定する場合
          g.append("rect")
            .attr("x", imageW + 20)
            .attr("y", 0)
            .attr("width", 0)
            .attr("height", 40)
            .attr("fill", (data) => data.color)
            .transition() /* アニメーションの設定を開始する合図 */
            .duration(1000) /*何秒かけてアニメーションするか */
            .delay(500) /*何秒遅らせるか */
            .ease(d3.easeLinear) /*イージングの種類 */
            .attr("width", (data) => scale(data.val));

          //クラス名で指定する場合
          g.append("text")
            .classed("label", true)
            .attr("font-size", "14")
            .attr("y", 20)
            .text((data) => data.label)
            .transition() /* アニメーションの設定を開始する合図 */
            .duration(1000) /*何秒かけてアニメーションするか */
            .delay(500) /*何秒遅らせるか */
            .ease(d3.easeLinear) /*イージングの種類 */
            .attr("width", (data) => scale(data.val))
            .attr("x", (data) => scale(data.val) / 2 + imageW + 20)
            .attr("text-anchor", "middle") // 水平中央揃え
            .attr("dy", "0.35em");

          g.append("text")
            .classed("value", true)
            .attr("font-size", "14")
            .attr("x", imageW + 20)
            .attr("y", 14)
            .text((data) => data.val);

          g.append("image")
            .attr("href", (data) => data.url)
            .attr("width", imageW);

          //id名「container」の要素にsvgを追加
          container.append(svg.node());
        })
        .catch((error) => {});
    </script>
  </body>
</html>
