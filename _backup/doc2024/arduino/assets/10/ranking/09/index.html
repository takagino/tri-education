<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        svg {
            background-color: #ddd;
        }

        #container {
            max-width: 640px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>映画興行収入ランキング</h1>
    <button id="start">グラフを表示</button>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const width = 640;
        const height = 480;
        const imageW = 100;
        const svg = d3.create("svg").attr("viewBox", `0 0 ${width} ${height}`);

        d3.json("./data.json")
            .then((dataset) => {
                const max = d3.max(dataset, (data) => data.val);
                const min = d3.min(dataset, (data) => data.val);
                console.log(max, min);

                const scale = d3.scaleLinear()
                    .domain([0, 100])
                    .range([0, 200]);

                const g = svg.selectAll(".item")
                    .data(dataset)
                    .enter()
                    .append("g")
                    .classed("item", true)
                    .attr("transform", (data, index) => `translate( 10,${index * imageW})`);

                //要素で指定する場合

                const rect = g
                    .append("rect")
                    .attr("x", 120)
                    .attr("y", 50)
                    .attr("width", 0)
                    .attr("height", 20)
                    .attr('fill', (data) => data.color);

                //クラス名で指定する場合
                const label = g
                    .append("text")
                    .classed("label", true)
                    .attr("font-size", "0")
                    .attr("x", imageW + 20)
                    .attr("y", 24)
                    .text((data) => data.label);

                const value = g
                    .append("text")
                    .classed("value", true)
                    .attr("font-size", "16")
                    .attr("x", 640)
                    .attr("y", 70)
                    .text((data) => data.val);

                const image = g
                    .append("image")
                    .attr("href", (data) => data.url)
                    .attr("width", 0)
                    .attr("y", 10);

                //id名「container」の要素にsvgを追加
                container.append(svg.node());

                const startBtn = document.querySelector("#start");
                startBtn.addEventListener("click", (e) => {
                    rect
                        .transition()
                        .duration(1000)
                        .delay(800)
                        .ease(d3.easeLinear)
                        .attr("width", (data) => scale(data.val));

                    label
                        .transition()
                        .duration(1000)
                        .delay(1000)
                        .ease(d3.easeLinear)
                        .attr("font-size", "16");

                    value
                        .transition()
                        .duration(1000)
                        .delay(1500)
                        .ease(d3.easeLinear)
                        .attr("x", (data) => scale(data.val) + 125);

                    image
                        .transition()
                        .duration(500)
                        .delay(500)
                        .ease(d3.easeLinear)
                        .attr("width", imageW);
                });
            })
            .catch((error) => {
            });


    </script>
</body>

</html>
