<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>外部データの読み込み</title>
  <style>
    body {
      margin: 0;
    }

    svg {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <button id="btn20" data-key="y2020">2020</button>
  <button id="btn21" data-key="y2021">2021</button>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    d3.json("./data.json")
      .then((dataset) => {
        const max20 = d3.max(dataset.y2020, (data) => data.val);
        const max21 = d3.max(dataset.y2021, (data) => data.val);
        const max = Math.max(max20, max21);
        const scale = d3.scaleLinear()
          .domain([0, max])
          .range([0, 300]);

        const svg = d3.select("body")
          .append("svg")
          .attr("viewBox", "0 0 500 300");

        const g = svg.selectAll(".item")
          .data(dataset.y2020)
          .enter()
          .append("g")
          .classed("item", true)
          .attr("transform", (data, index) => `translate(0, ${index * 90})`);

        const rect = g.append("rect")
          .attr("width", 0)
          .attr("height", 20)
          .attr("x", 110)
          .attr("y", 35);

        const val = g.append("text")
          .classed("val", true)
          .attr("font-size", "14px")
          .attr("x", 110)
          .attr("y", 50);

        const label = g.append("text")
          .classed("label", true)
          .attr("font-size", "14px")
          .attr("x", 110)
          .attr("y", 20);

        const img = g.append("image")
          .attr("width", 100);

        const btn = document.querySelectorAll("button");

        btn.forEach(elem => {
          elem.addEventListener('click', () => {
            onChange(elem.dataset.key);
          });
        });

        const onChange = (key) => {
          rect.data(dataset[key])
            .transition()
            .duration(1000)
            .delay((data, index) => index * 500)
            .ease(d3.easeExpIn)
            .attr("fill", (data) => data.color)
            .attr("width", (data) => scale(data.val));

          val.data(dataset[key])
            .text((data) => data.val)
            .transition()
            .duration(1000)
            .delay((data, index) => index * 500)
            .ease(d3.easeExpIn)
            .attr("x", (data) => 110 + scale(data.val));

          label.data(dataset[key])
            .text((data) => data.label);

          img.data(dataset[key])
            .attr("href", (data) => data.url);
        }
      })
      .catch((error) => {
        /* データの読み込みに失敗したら、以下の命令を実行 */
      });
  </script>
</body>
</html>
