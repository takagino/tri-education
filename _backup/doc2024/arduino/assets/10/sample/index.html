<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>外部データの読み込み</title>
  <style>
    body {
      margin: 0;
    }

    svg {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <button id="btn20" data-key="val20">2020</button>
  <button id="btn21" data-key="val21">2021</button>
  <button id="btn22" data-key="val22">2022</button>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    d3.json("./data.json")
      .then((dataset) => {
        const max = d3.max(dataset, (data) => Math.max(data.val20, data.val21, data.val22));

        const scale = d3.scaleLinear()
          .domain([0, max])
          .range([0, 300]);

        const svg = d3.select("body")
          .append("svg")
          .attr("viewBox", "0 0 500 300");

        const g = svg.selectAll(".item")
          .data(dataset)
          .enter()
          .append("g")
          .classed("item", true)
          .attr("transform", (data, index) => `translate(0, ${index * 90})`);

        const rect = g.append("rect")
          .attr("width", 0)
          .attr("height", 20)
          .attr("x", 110)
          .attr("y", 35)
          .attr("fill", (data) => data.color);

        const val = g.append("text")
          .classed("val", true)
          .attr("font-size", "14px")
          .attr("x", 110)
          .attr("y", 50);

        g.append("text")
          .classed("label", true)
          .text((data) => data.label)
          .attr("font-size", "14px")
          .attr("x", 110)
          .attr("y", 20);

        g.append("image")
          .attr("href", (data) => data.url)
          .attr("width", 100);

        const btn = document.querySelectorAll("button");

        btn.forEach(elem => {
          console.log(elem.dataset.key);
          elem.addEventListener('click', () => {
            onChange(elem.dataset.key);
          });
        });

        const onChange = (key) => {
          rect.transition()
            .duration(1000)
            .delay((data, index) => index * 500)
            .ease(d3.easeExpIn)
            .attr("width", (data) => scale(data[key]));

          val.text((data) => data[key])
            .transition()
            .duration(1000)
            .delay((data, index) => index * 500)
            .ease(d3.easeExpIn)
            .attr("x", (data) => 110 + scale(data[key]));
        }
      })
      .catch((error) => {
        /* データの読み込みに失敗したら、以下の命令を実行 */
      });
  </script>
</body>
</html>
