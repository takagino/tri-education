<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css"> -->
    <title>d3.js</title>
    <style>
        svg {
            background-color: #ddd;
            margin-bottom: -6px;
        }


        .nav {
            display: flex;
            justify-content: space-evenly;
            margin: 60px 0 40px;
            background: #fff;
        }

        button {
            border-style: none;
            background: none;
            font-size: 20px;

        }

        .side {
            width: 50%;
            background: #000;
            background-position: center;
            background-size: cover;
        }

        .container {
            width: 50%;

        }

        .main {
            display: flex;
            width: 100%;
        }

        #container {
            width: 100%;
        }

        h2 {
            text-align: center;
            margin: 40px 0 0;
        }

        body {
            max-height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>

    <h2>好きなアーティストの再生数TOP5の曲</h2>
    <div class="nav">

        <button id="btn23" data-key="y2023">てにをは</button>
        <button id="btn24" data-key="y2024">DUSTCELL</button>
        <button id="btn25" data-key="y2025">wotaku</button>
        <button id="btn26" data-key="y2026">Giga</button>
    </div>
    <div class="main">
        <div class="side">

        </div>
        <div id="container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const width = 800;
        const height = 500;

        const svg = d3.create("svg").attr("viewBox", `0 0 ${width} ${height}`); //レスポンシブ対応


        d3.json("./data2.json")
            .then((dataset) => {
                //データのスケーリング
                const max23 = d3.max(dataset.y2023, (data) => data.val);//y2023のデータの中でdata.valの中で一番大きい値をmax23に代入してる
                const max24 = d3.min(dataset.y2024, (data) => data.val);
                const max25 = d3.min(dataset.y2025, (data) => data.val);
                const max26 = d3.min(dataset.y2026, (data) => data.val);
                const max = Math.max(max23, max24, max25, max26)//どっちか大きい値をmaxに代入
                const scale = d3.scaleLinear().domain([0, max]).range([0, 400]);//0から400までに制限


                const g = svg
                    .selectAll(".item")
                    .data(dataset.y2023)
                    .enter()
                    .append("g")
                    .classed("item", true)
                    .attr("transform", (data, index) => `translate(0, ${index * 100})`); //グループは「transform」で操作

                const rect = g
                    .append("rect")
                    .attr("x", 20)
                    .attr("y", 35)
                    .attr("width", 0)
                    .attr("height", 10)
                    .attr("fill", (data) => data.color);


                //クラス名で指定する場合
                const label = g
                    .append("text")
                    .classed("label", true)
                    .attr("font-size", 10)
                    .attr("x", (data) => 20)
                    .attr("y", 30)
                    .attr("fill", (data) => data.color)
                    .text((data) => data.label);


                const val = g
                    .append("text")
                    .classed("value", true)
                    .attr("font-size", 10)
                    .attr("x", 20)
                    .attr("y", 44)
                    .text((data) => data.val);







                //id名「container」の要素にsvgを追加
                container.append(svg.node());


                /*3 カスタムデータ属性で制御　*/
                const onChange = (key) => {
                    rect
                        .data(dataset[key])
                        .transition()
                        .duration(1000)
                        .delay((data, index) => index * 200)
                        .ease(d3.easePolyOut)
                        .attr("width", (data) => scale(data.val));

                    val
                        .data(dataset[key])
                        .text((data) => data.val)
                        .transition()
                        .duration(1000)
                        .delay((data, index) => index * 200 + 20)
                        .ease(d3.easePolyOut)
                        .attr("x", (data) => 30 + scale(data.val));

                    label.data(dataset[key]).text((data) => data.label);


                }


                const btn = document.querySelectorAll("button");

                btn.forEach(elm => {
                    elm.addEventListener('click', () => {
                        onChange(elm.dataset.key);

                    });


                });



                const buttons = document.querySelectorAll('.nav button');
                const sideDiv = document.querySelector('.side');

                // 画像データの配列 (実際の画像パスに置き換えてください)
                const images = [
                    { key: 'y2023', src: 'img/teniwoha.jpg' },
                    { key: 'y2024', src: 'img/dustcell.jpg' },
                    { key: 'y2025', src: 'img/wotaku.jpg' },
                    { key: 'y2026', src: 'img/giga.webp' }
                ];

                buttons.forEach(button => {
                    button.addEventListener('click', () => {
                        const key = button.dataset.key;
                        const selectedImage = images.find(img => img.key === key);
                        sideDiv.style.backgroundImage = `url(${selectedImage.src})`;
                    });
                });

            })


            .catch((error) => { });


    </script>
</body>

</html>
