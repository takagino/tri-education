<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artist Song Visualization</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        color: white;
        overflow: hidden;
      }
      .buttons {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 2;
      }
      button {
        padding: 8px 16px;
        margin-right: 10px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        backdrop-filter: blur(5px);
      }
      button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .bar {
        transition: all 0.3s ease;
      }
      .bar:hover {
        opacity: 0.8;
      }
      .artist-image {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .artist-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.5);
      }
      .axis text {
        fill: white;
        font-size: 14px;
      }
      .axis path,
      .axis line {
        stroke: rgba(255, 255, 255, 0.3);
      }
      #visualization {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="buttons" id="artist-buttons"></div>
    <div id="visualization"></div>
    <div class="artist-image">
      <img src="https://unison-s-g.com/assets/img/img_kv_static.jpg" alt="" />
    </div>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
      const data = {
        "UNISON SQUARE GARDEN": {
          songs: {
            シュガーソングとビターステップ: 67763854,
            傍若のカリスマ: 3613087,
            カオスが極まる: 24666683,
            オリオンをなぞる: 12790204,
            イト: 2373725,
          },
          imageUrl: "https://unison-s-g.com/assets/img/img_kv_static.jpg",
          color: "#FF9933", // エネルギッシュで陽気な印象からオレンジ
        },
        POPLE１: {
          songs: {
            DOGLAND: 31957959,
            メリバ: 1974730,
            DALMATIAN: 468145,
            常夜燈: 15859381,
            怪獣: 13413123,
          },
          imageUrl:
            "https://ppppeople1.com/s3/skiyaki/uploads/ckeditor/pictures/640567/content_RGB_PEOPLE_1_2024%E3%82%A2%E3%83%BC%E3%83%86%E3%82%A3%E3%82%B9%E3%83%88%E5%86%99%E7%9C%9Frenzo.jpg",
          color: "#FF3366", // ポップでパンキッシュな印象からビビッドなピンク
        },
        羊文学: {
          songs: {
            "more than words": 81977251,
            Burnig: 14706605,
            1999: 14706605,
            光るとき: 12740244,
            永遠のブルー: 6619034,
          },
          imageUrl:
            "https://former-cdn.cinra.net/uploads/img/2023/5cbd3a6ca159da53de3b4c043e1baa8ec9787a882.jpeg",
          color: "#66CCFF", // 透明感のある音楽性から爽やかな水色
        },
        須田景凪: {
          songs: {
            veil: 96359883,
            ダーリン: 15683916,
            メロウ: 8703802,
            ユートピア: 2004271,
            パレイドリア: 4619530,
          },
          imageUrl:
            "https://pbs.twimg.com/media/GAp6d42boAAyldc?format=jpg&name=medium",
          color: "#9966CC", // 幻想的な世界観から紫
        },
        ゲスの極み乙女: {
          songs: {
            ロマンスがありあまる: 13362987,
            私以外私じゃないの: 23680133,
            キラーボール: 12838307,
            猟奇的なキスを私にして: 5424083,
            オトナチック: 4216989,
          },
          imageUrl: "https://pbs.twimg.com/media/GMuf1ZjbkAA6Pua.jpg:large",
          color: "#CC3366", // 毒のある艶やかさからディープなローズ
        },
      };

      const buttonContainer = d3.select("#artist-buttons");
      Object.keys(data).forEach((artist) => {
        buttonContainer
          .append("button")
          .text(artist)
          .on("mouseover", () => updateVisualization(artist));
      });

      const margin = { top: 40, right: 100, bottom: 40, left: 300 };
      const width = window.innerWidth - margin.left - margin.right;
      const height = window.innerHeight - margin.top - margin.bottom;

      const svg = d3
        .select("#visualization")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const x = d3.scaleLinear().range([0, width]);
      const y = d3.scaleBand().range([0, height]).padding(0.2);

      svg
        .append("g")
        .attr("class", "x-axis axis")
        .attr("transform", `translate(0,${height})`);

      svg.append("g").attr("class", "y-axis axis");

      function updateVisualization(artist) {
        const artistData = data[artist];
        document.querySelector(".artist-image img").src = artistData.imageUrl;
        const songData = Object.entries(artistData.songs)
          .map(([name, value]) => ({
            name,
            value,
          }))
          .sort((a, b) => b.value - a.value); // 値が大きい順にソート

        x.domain([0, d3.max(songData, (d) => d.value * 1.1)]); // 10%余白を追加
        y.domain(songData.map((d) => d.name));

        svg
          .select(".x-axis")
          .transition()
          .duration(1000)
          .call(
            d3
              .axisBottom(x)
              .ticks(5)
              .tickFormat((d) => d3.format(".2s")(d))
          );

        svg.select(".y-axis").transition().duration(1000).call(d3.axisLeft(y));

        const bars = svg.selectAll(".bar").data(songData, (d) => d.name);

        bars.exit().transition().duration(500).attr("width", 0).remove();

        bars
          .enter()
          .append("rect")
          .attr("class", "bar")
          .attr("y", (d) => y(d.name))
          .attr("height", y.bandwidth())
          .attr("x", 0)
          .attr("width", 0)
          .attr("fill", artistData.color)
          .merge(bars)
          .transition()
          .duration(1000)
          .attr("y", (d) => y(d.name))
          .attr("width", (d) => x(d.value))
          .attr("height", y.bandwidth())
          .attr("fill", artistData.color);

        const labels = svg
          .selectAll(".value-label")
          .data(songData, (d) => d.name);

        labels.exit().remove();

        labels
          .enter()
          .append("text")
          .attr("class", "value-label")
          .attr("fill", "white")
          .attr("font-size", "14px")
          .attr("x", (d) => x(d.value) + 10)
          .attr("y", (d) => y(d.name) + y.bandwidth() / 2)
          .attr("dy", ".35em")
          .text((d) => d3.format(".2s")(d.value))
          .merge(labels)
          .transition()
          .duration(1000)
          .attr("x", (d) => x(d.value) + 10)
          .attr("y", (d) => y(d.name) + y.bandwidth() / 2);
      }

      // ウィンドウリサイズ時の処理を追加
      window.addEventListener("resize", () => {
        const width = window.innerWidth - margin.left - margin.right;
        const height = window.innerHeight - margin.top - margin.bottom;

        svg
          .attr("width", width + margin.left + margin.right)
          .attr("height", height + margin.top + margin.bottom);

        x.range([0, width]);
        y.range([0, height]);

        updateVisualization(Object.keys(data)[0]);
      });

      updateVisualization(Object.keys(data)[0]);
    </script>
  </body>
</html>
