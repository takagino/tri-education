<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>d3.js 可視化</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            background-image: url("People-at-the-station-thumb-640x427-518.jpg");
            background-size: cover;
            /* 画面全体に画像をフィットさせる */
            background-position: center;
            /* 画像を中央に配置 */
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            background-color: rgba(255, 255, 255, 0.8);
            /* 背景が半透明で画像が透けて見える */
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 800px;
        }

        svg {
            background-color: #e8f5e9;
            border-radius: 10px;
        }

        .button-container {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            background-color: #028482;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #026f66;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div id="container">
        <h1>1日の利用者数が多い駅ランキング</h1>

        <div class="button-container">
            <button id="btn23" data-key="val23">2023</button>
            <button id="btn24" data-key="val24">2022</button>
            <button id="btn25" data-key="val25">2021</button>
        </div>

        <div id="chart"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const width = 640;
        const height = 480;
        const imageW = 100;
        const svg = d3.create("svg").attr("viewBox", `0 0 ${width} ${height}`);

        d3.json("./data.json")
            .then((dataset) => {
                // データのスケーリング
                const max = d3.max(dataset, (data) => Math.max(data.val23, data.val24, data.val25));
                const scale = d3.scaleLinear().domain([0, max]).range([0, 400]);

                // 均等に配置するための高さのスケール
                const itemHeight = (height - 40) / dataset.length;

                const g = svg
                    .selectAll(".item")
                    .data(dataset)
                    .enter()
                    .append("g")
                    .classed("item", true)
                    .attr("transform", (data, index) => `translate(20, ${index * itemHeight + 20})`);

                const rect = g
                    .append("rect")
                    .attr("x", imageW + 20)
                    .attr("y", 35)
                    .attr("width", 0)
                    .attr("height", 20)
                    .attr("fill", (data) => data.color)
                    .style("opacity", 0); // 初期状態で透明にする

                const label = g
                    .append("text")
                    .classed("label", true)
                    .attr("font-size", 15)
                    .attr("x", (data) => imageW + 20)
                    .attr("y", 15)
                    .attr("fill", (data) => data.color)
                    .text((data) => data.label)
                    .style("opacity", 1); // 駅名は常に表示しておく

                const val = g
                    .append("text")
                    .classed("value", true)
                    .attr("font-size", 15)
                    .attr("x", imageW + 20)
                    .attr("y", 50)
                    .text((data) => {
                        const value = data.val23;
                        let formattedValue = '';
                        if (value >= 10000) {
                            formattedValue = Math.floor(value / 10000) + "万" + (value % 10000) + "人";
                        } else {
                            formattedValue = value + "人";
                        }
                        return formattedValue;
                    })
                    .style("opacity", 0); // 初期状態で透明にする

                const img = g
                    .append("image")
                    .attr("href", (data) => data.url)
                    .attr("width", imageW);

                // id名「container」の要素にsvgを追加
                document.getElementById("chart").append(svg.node());

                const onChange = (key) => {
                    // スムーズにスライドインし、フェードイン
                    rect
                        .transition()
                        .duration(1200)
                        .delay((data, index) => index * 250)
                        .ease(d3.easeCubic)  // 滑らかなアニメーション
                        .attr("width", (data) => scale(data[key]))
                        .style("opacity", 1); // フェードイン

                    val
                        .text((data) => {
                            const value = data[key];
                            let formattedValue = '';
                            if (value >= 10000) {
                                formattedValue = Math.floor(value / 10000) + "万" + (value % 10000) + "人";
                            } else {
                                formattedValue = value + "人";
                            }
                            return formattedValue;
                        })
                        .transition()
                        .duration(1200)
                        .delay((data, index) => index * 250)
                        .ease(d3.easeCubic)  // 滑らかなアニメーション
                        .attr("x", (data) => imageW + 20 + scale(data[key]))  // 新しい位置にスライド
                        .style("opacity", 1); // フェードイン
                };

                const btn = document.querySelectorAll("button");
                btn.forEach((elem) => {
                    elem.addEventListener("click", () => {
                        onChange(elem.dataset.key);
                    });
                });
            })
            .catch((error) => {
                console.error(error);
            });
    </script>
</body>

</html>
