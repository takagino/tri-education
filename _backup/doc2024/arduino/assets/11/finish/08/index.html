<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gokou kuyt</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #fce4ec;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            margin: 10px;
            background-color: #ff80ab;
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff4081;
            transform: scale(1.05);
        }

        #container {
            width: 100%;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        svg {
            border-radius: 15px;
            background-color: #f8bbd0;
        }

        .item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .item text {
            font-size: 14px;
            font-weight: 600;
            fill: #ff4081;
        }

        .item image {
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid #ff4081;
        }

        .value {
            font-size: 12px;
            font-weight: bold;
            fill: #ff4081;
        }

        .label {
            font-size: 12px;
            font-weight: 500;
            fill: #ff4081;
        }
    </style>
</head>

<body>
    <button id="btnSoundCloud" data-key="soundcloud">SoundCloud</button>
    <button id="btnYouTube" data-key="youtube">YouTube</button>

    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const width = 600;
        const height = 400;
        const imageW = 60;
        const svg = d3.create("svg").attr("viewBox", `0 0 ${width} ${height}`);

        d3.json("./data.json")
            .then((dataset) => {
                const maxSoundCloud = d3.max(dataset.soundcloud, (data) => data.val);
                const maxYouTube = d3.max(dataset.youtube, (data) => data.val);
                const max = Math.max(maxSoundCloud, maxYouTube);
                const scale = d3.scaleLinear().domain([0, max]).range([0, 300]);

                const g = svg
                    .selectAll(".item")
                    .data(dataset.soundcloud)
                    .enter()
                    .append("g")
                    .classed("item", true)
                    .attr("transform", (data, index) => `translate(20, ${index * 80 + 20})`);

                const rect = g
                    .append("rect")
                    .attr("x", imageW + 10)
                    .attr("y", 35)
                    .attr("width", 0)
                    .attr("height", 15)
                    .attr("fill", (data) => data.color);

                const label = g
                    .append("text")
                    .classed("label", true)
                    .attr("font-size", 10)
                    .attr("x", (data) => imageW + 10)
                    .attr("y", 15)
                    .attr("fill", (data) => data.color)
                    .text((data) => data.label);

                const val = g
                    .append("text")
                    .classed("value", true)
                    .attr("font-size", 10)
                    .attr("x", imageW + 10)
                    .attr("y", 50)
                    .text((data) => data.val);

                const img = g
                    .append("image")
                    .attr("href", (data) => data.url)
                    .attr("width", imageW);

                container.append(svg.node());

                const onChange = (key) => {
                    rect
                        .data(dataset[key])
                        .transition()
                        .duration(1000)
                        .delay((data, index) => index * 200)
                        .ease(d3.easeBounceIn)
                        .attr("width", (data) => scale(data.val));

                    val
                        .data(dataset[key])
                        .text((data) => data.val)
                        .transition()
                        .duration(1000)
                        .delay((data, index) => index * 200)
                        .ease(d3.easeBounceIn)
                        .attr("x", (data) => imageW + 20 + scale(data.val));

                    label.data(dataset[key]).text((data) => data.label);

                    img.data(dataset[key]).attr("href", (data) => data.url);
                };

                const btn = document.querySelectorAll("button");

                btn.forEach((elem) => {
                    elem.addEventListener("click", () => {
                        onChange(elem.dataset.key);
                    });
                });
            })
            .catch((error) => console.error(error));
    </script>
</body>

</html>
