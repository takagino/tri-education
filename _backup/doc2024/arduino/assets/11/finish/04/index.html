<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>d3.js</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap"
      rel="stylesheet"
    />
    <style>
      h1 {
        text-align: center;
        color: #494a48;
      }

      .btn_block {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      button {
        background-image: linear-gradient(
          to right,
          #ed6ea0,
          #ec8c69,
          #f7186a,
          #fbb03b
        );
        box-shadow: 0 4px 15px 0 rgba(236, 116, 149, 0.75);
        color: #fff;
        width: 150px;
        border: none;
        width: 200px;
        font-size: 16px;
        font-weight: 600;

        cursor: pointer;
        margin: 20px;
        height: 55px;
        text-align: center;
        background-size: 300% 100%;

        border-radius: 50px;

        -o-transition: all 0.4s ease-in-out;
        -webkit-transition: all 0.4s ease-in-out;
        transition: all 0.4s ease-in-out;
      }

      button:hover {
        background-position: 100% 0;

        -o-transition: all 0.4s ease-in-out;
        -webkit-transition: all 0.4s ease-in-out;
        transition: all 0.4s ease-in-out;
      }

      button:focus {
        outline: none;
      }

      body {
        font-family: "Zen Maru Gothic", serif;
        font-weight: 400;
        font-style: normal;
      }
      image:hover {
        transform: scale(1.1) rotate(0.001deg);
        transition: 0.5s all;
      }
    </style>
  </head>
  <body>
    <h1>YouTube再生回数</h1>
    <div class="btn_block">
      <div class="btn_1">
        <button id="btn23" data-key="y2023">2023MV</button>
      </div>
      <div class="btn_1">
        <button id="btn24" data-key="y2024">Performance</button>
      </div>
    </div>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      const width = 640;
      const height = 800;
      const imageW = 150;
      const svg = d3.create("svg").attr("viewBox", `0 0 ${width} ${height}`); //レスポンシブ対応

      d3.json("./data2.json")
        .then((dataset) => {
          //データのスケーリング
          const max23 = d3.max(dataset.y2023, (data) => data.val);
          const max24 = d3.max(dataset.y2024, (data) => data.val);
          const max = Math.max(max23, max24);
          const scale = d3.scaleLinear().domain([0, max]).range([0, 300]);

          const g = svg
            .selectAll(".item")
            .data(dataset.y2023)
            .enter()
            .append("g")
            .classed("item", true)
            .attr(
              "transform",
              (data, index) => `translate(20, ${index * 130 + 20})`
            );

          const rect = g
            .append("rect")
            .attr("x", imageW + 20)
            .attr("y", 35)
            .attr("width", 0)
            .attr("height", 20)
            .attr("fill", (data) => data.color);

          const label = g
            .append("text")
            .classed("label", true)
            .attr("font-size", 15)
            .attr("x", (data) => imageW + 20)
            .attr("y", 15)
            .attr("fill", (data) => data.color)
            .text((data) => data.label);

          const val = g
            .append("text")
            .classed("value", true)
            .attr("font-size", 15)
            .attr("x", imageW + 20)
            .attr("y", 50)
            .text((data) => data.val);

          const img = g
            .append("image")
            .attr("href", (data) => data.url)
            .attr("width", imageW);

          //id名「container」の要素にsvgを追加
          container.append(svg.node());

          const onChange = (key) => {
            rect
              .data(dataset[key])
              .transition()
              .duration(1200)
              .delay((data, index) => index * 200)
              .ease(d3.easeElastic)
              .attr("width", (data) => scale(data.val));

            val
              .data(dataset[key])
              .text((data) => data.val)
              .transition()
              .duration(1200)
              .delay((data, index) => index * 200)
              .ease(d3.easeElastic)
              .attr("x", (data) => imageW + 20 + scale(data.val));

            label.data(dataset[key]).text((data) => data.label);

            img.data(dataset[key]).attr("href", (data) => data.url);
          };

          const btn = document.querySelectorAll("button");

          btn.forEach((elem) => {
            elem.addEventListener("click", () => {
              onChange(elem.dataset.key);
            });
          });
        })
        .catch((error) => {});
    </script>
  </body>
</html>
