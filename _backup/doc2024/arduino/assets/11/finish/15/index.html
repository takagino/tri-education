<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>課題</title>
    <style>
        body {
            background-image: url("http://127.0.0.1:5501/images/back_ground.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            height: 100%;
        }

        .content {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            margin: 50px auto;
            max-width: 800px;
            font-family: Arial, sans-serif;
            border-radius: 10px;
            margin-top: 150px;
            /* .content全体を少し下に移動 */
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            margin: 10px;
            width: 200px;
            text-align: center;
            cursor: pointer;
        }

        .card img {
            max-width: 100%;
            border-radius: 5px;
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        /* h1の位置を調整 */
        h1 {
            position: absolute;
            /* top: 100px; */
            /* 上部から少し下に移動 */
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: #f0e68c;
            margin: 0;
            padding: 10px;
        }

        /* ボタンが横並びになるように変更 */
        button {
            appearance: auto;
            font-style: normal;
            font-weight: bold;
            font-size: 1rem;
            font-family: 'Arial', sans-serif;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            display: inline-block;
            text-align: center;
            cursor: pointer;
            background-color: #ffb6c1;
            margin: 10px;
            padding-block: 10px;
            padding-inline: 20px;
            border-width: 2px;
            border-style: solid;
            border-color: #ff69b4;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        /* ボタンが横並びになるように */
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background-color: #ff69b4;
            border-color: #ff1493;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }

        button:active {
            background-color: #ff1493;
            border-color: #ff1493;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <h1>サンリオキャラクター大賞</h1>

    <button id="btn22" data-key="val22">2024年順位</button>
    <button id="btn23" data-key="val23">2023年順位</button>



    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        // 数値を万単位でフォーマットする関数
        const formatNumber = (value) => {
            if (value >= 10000) {
                return (value / 10000).toFixed(1) + "万"; // 10,000以上の値を万単位で表示
            }
            return value; // それ未満の値はそのまま表示
        };

        const width = 640;
        const height = 480;
        const imageW = 100;
        const svg = d3.create("svg").attr("viewBox", `0 0 ${width} ${height}`);

        d3.json("./data.json")
            .then((dataset) => {


                const max22 = d3.max(dataset.y2022, (data) => data.val22);
                const max23 = d3.max(dataset.y2022, (data) => data.val23);
                const max24 = d3.max(dataset.y2022, (data) => data.val24);
                const max25 = d3.max(dataset.y2022, (data) => data.val25);
                const max = Math.max(max22, max23, max24, max25) * 1.2;
                // const max = Math.max(data.val22, data.val23, data.val24, data.val25) * 1.2;
                // const max = Math.max(max22, max23, max24) * 1.2;
                const scale = d3.scaleLinear().domain([0, max]).range([0, width - imageW - 40]);

                const g = svg
                    .selectAll(".item")
                    .data(dataset.y2022)
                    .enter()
                    .append("g")
                    .classed("item", true)
                    .attr("transform", (data, index) => `translate(20, ${index * 100 + 20})`);  // アイテム間隔を100に調整


                const rect = g
                    .append("rect")
                    .attr("x", imageW + 40)  // 画像との間隔を広げる
                    .attr("y", 35)
                    .attr("width", 0)
                    .attr("height", 20)
                    .attr("fill", (data) => data.color);

                const label = g
                    .append("text")
                    .classed("label", true)
                    .attr("font-size", 15)
                    .attr("x", (data) => imageW + 40)  // 画像との間隔を広げる
                    .attr("y", 15)
                    .attr("fill", (data) => data.color)
                    .text((data) => data.label);

                const val = g
                    .append("text")
                    .classed("value", true)
                    .attr("font-size", 15)
                    .attr("x", imageW + 40)  // 画像との間隔を広げる
                    .attr("y", 50)
                    .text((data) => formatNumber(data.val22));  // 初期表示を万単位でフォーマット

                const img = g
                    .append("image")
                    .attr("href", (data) => data.url)
                    .attr("width", imageW)
                    .attr("x", 20);  // 画像を左側に配置

                container.append(svg.node());

                const onChange = (key) => {
                    rect
                        .transition()
                        .duration(1000)
                        .delay((data, index) => index * 200)
                        .ease(d3.easeBounceIn)
                        .attr("width", (data) => scale(data[key]));

                    val
                        .text((data) => formatNumber(data[key]))  // 更新された値を万単位で表示
                        .transition()
                        .duration(1000)
                        .delay((data, index) => index * 200)
                        .ease(d3.easeBounceIn)
                        .attr("x", (data) => imageW + 40 + scale(data[key]));
                };

                const btn = document.querySelectorAll("button");
                btn.forEach((elem) => {
                    elem.addEventListener("click", () => {
                        onChange(elem.dataset.key);
                    });
                });
            })

            .catch((error) => { });


    </script>
</body>

</html>
