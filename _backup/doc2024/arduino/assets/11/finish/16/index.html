<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel CPU ベンチマーク比較</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/modern-css-reset/dist/reset.min.css"
    />
    <link rel="stylesheet" href="./css/style.min.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <div class="button-container">
          <button id="btn14intel" data-key="14世代intel">14世代Intel</button>
          <button id="btn13intel" data-key="13世代intel">13世代Intel</button>
          <button id="btn12intel" data-key="12世代intel">12世代Intel</button>
          <button id="toggleTheme">ダークモード切替</button>
        </div>
      </div>
    </header>

    <div id="container"></div>
    <div class="tooltip" id="tooltip"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      const margin = { top: 50, right: 150, bottom: 50, left: 150 };
      const imageW = 50; // 画像の幅を縮小
      const imageH = 30; // 画像の高さを縮小
      let history = [];
      let theme = "light";

      // 固定されたSVGの高さ
      const svgHeight = 800;

      const svg = d3.create("svg").attr("viewBox", `0 0 800 ${svgHeight}`);

      const chart = svg
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const tooltip = d3.select("#tooltip");

      // スケール設定
      const xScale = d3
        .scaleLinear()
        .range([0, 800 - margin.left - margin.right - 200]);
      const yScale = d3
        .scaleBand()
        .range([0, svgHeight - margin.top - margin.bottom])
        .padding(0.1); // パディングを0.1に設定

      const xAxisGroup = chart
        .append("g")
        .attr("class", "x-axis")
        .attr(
          "transform",
          `translate(0, ${svgHeight - margin.top - margin.bottom})`
        );
      const yAxisGroup = chart.append("g").attr("class", "y-axis");

      document.querySelector("#container").append(svg.node());

      d3.json("./data.json")
        .then((dataset) => {
          let currentKey = "14世代intel";
          let currentData = dataset[currentKey];

          // yScaleのドメインを設定
          yScale.domain(currentData.map((d) => d.label));
          // xScaleのドメインを設定
          xScale.domain([0, d3.max(currentData, (d) => d.val) * 1.1]);

          // タイトルの追加
          chart
            .append("text")
            .attr("x", (800 - margin.left - margin.right) / 2)
            .attr("y", -20)
            .attr("text-anchor", "middle")
            .attr("font-size", "20px")
            .text("Intel CPU ベンチマーク比較");

          // X軸ラベルの追加
          chart
            .append("text")
            .attr("x", (800 - margin.left - margin.right) / 2)
            .attr("y", svgHeight - margin.top - margin.bottom + 40)
            .attr("text-anchor", "middle")
            .attr("font-size", "14px")
            .text("ベンチマーク値");

          // Y軸ラベルの追加
          chart
            .append("text")
            .attr("transform", "rotate(-90)")
            .attr("x", -(svgHeight - margin.top - margin.bottom) / 2)
            .attr("y", -120)
            .attr("text-anchor", "middle")
            .attr("font-size", "14px")
            .text("CPUモデル");

          // グラフの初期描画
          const g = chart
            .selectAll(".item")
            .data(currentData, (d) => d.label)
            .enter()
            .append("g")
            .attr("class", "item")
            .attr("transform", (d) => `translate(0, ${yScale(d.label)})`)
            .on("mouseover", (event, d) => {
              tooltip.transition().duration(200).style("opacity", 0.9);
              tooltip
                .html(`<strong>${d.label}</strong><br/>ベンチマーク: ${d.val}`)
                .style("left", event.pageX + 5 + "px")
                .style("top", event.pageY - 28 + "px");
            })
            .on("mouseout", () => {
              tooltip.transition().duration(500).style("opacity", 0);
            })
            .on("click", (event, d) => {
              alert(`${d.label}の詳細情報:\nベンチマーク: ${d.val}`);
            });

          // 画像の垂直位置を中央に調整
          g.append("image")
            .attr("href", (d) => d.url)
            .attr("width", imageW)
            .attr("height", imageH)
            .attr("x", -imageW - 10)
            .attr("y", (d) => (yScale.bandwidth() - imageH) / 2);

          // 棒グラフの描画
          g.append("rect")
            .attr("height", yScale.bandwidth() * 0.6) // バーの高さを帯域幅の60%に設定
            .attr("y", yScale.bandwidth() * 0.2) // バーの垂直位置を帯域幅の20%に設定
            .attr("width", 0)
            .attr("fill", (d) => d.color)
            .transition()
            .duration(1000)
            .attr("width", (d) => xScale(d.val));

          // 値のテキスト表示
          g.append("text")
            .attr("x", (d) => xScale(d.val) + 5)
            .attr("y", yScale.bandwidth() * 0.5) // テキストの垂直位置を中央に設定
            .attr("dy", ".35em")
            .text((d) => d.val)
            .attr("font-size", "14px")
            .attr("fill", "#000")
            .transition()
            .duration(1000)
            .attr("x", (d) => xScale(d.val) + 5);

          // 軸の描画
          xAxisGroup.call(d3.axisBottom(xScale));
          yAxisGroup.call(d3.axisLeft(yScale));

          // データの更新関数
          const onChange = (key) => {
            history.push(JSON.parse(JSON.stringify(currentData)));
            currentKey = key;
            currentData = dataset[key];

            // yScaleのドメインを更新
            yScale.domain(currentData.map((d) => d.label));
            // xScaleのドメインを更新
            xScale.domain([0, d3.max(currentData, (d) => d.val) * 1.1]);

            // 軸を更新
            yAxisGroup.transition().duration(1000).call(d3.axisLeft(yScale));
            xAxisGroup.transition().duration(1000).call(d3.axisBottom(xScale));

            // データのバインドと更新
            const updated = chart
              .selectAll(".item")
              .data(currentData, (d) => d.label);

            // Enter
            const enter = updated
              .enter()
              .append("g")
              .attr("class", "item")
              .attr("transform", (d) => `translate(0, ${yScale(d.label)})`)
              .on("mouseover", (event, d) => {
                tooltip.transition().duration(200).style("opacity", 0.9);
                tooltip
                  .html(
                    `<strong>${d.label}</strong><br/>ベンチマーク: ${d.val}`
                  )
                  .style("left", event.pageX + 5 + "px")
                  .style("top", event.pageY - 28 + "px");
              })
              .on("mouseout", () => {
                tooltip.transition().duration(500).style("opacity", 0);
              })
              .on("click", (event, d) => {
                alert(`${d.label}の詳細情報:\nベンチマーク: ${d.val}`);
              });

            // 画像の追加
            enter
              .append("image")
              .attr("href", (d) => d.url)
              .attr("width", imageW)
              .attr("height", imageH)
              .attr("x", -imageW - 10)
              .attr("y", (d) => (yScale.bandwidth() - imageH) / 2);

            // 棒グラフの追加
            enter
              .append("rect")
              .attr("height", yScale.bandwidth() * 0.6)
              .attr("y", yScale.bandwidth() * 0.2)
              .attr("width", 0)
              .attr("fill", (d) => d.color)
              .transition()
              .duration(1000)
              .attr("width", (d) => xScale(d.val));

            // 値のテキスト追加
            enter
              .append("text")
              .attr("x", (d) => xScale(d.val) + 5)
              .attr("y", yScale.bandwidth() * 0.5)
              .attr("dy", ".35em")
              .text((d) => d.val)
              .attr("font-size", "14px")
              .attr("fill", "#fff")
              .transition()
              .duration(1000)
              .attr("x", (d) => xScale(d.val) + 5);

            // Update
            updated
              .transition()
              .duration(1000)
              .attr("transform", (d) => `translate(0, ${yScale(d.label)})`);

            updated
              .select("image")
              .attr("y", (d) => (yScale.bandwidth() - imageH) / 2);

            updated
              .select("rect")
              .transition()
              .duration(1000)
              .attr("width", (d) => xScale(d.val))
              .attr("fill", (d) => d.color);

            updated
              .select("text")
              .transition()
              .duration(1000)
              .attr("x", (d) => xScale(d.val) + 5)
              .text((d) => d.val);

            // Exit
            updated.exit().remove();
          };

          // ボタンにイベントリスナーを追加
          d3.selectAll(".button-container button").on("click", function () {
            const key = d3.select(this).attr("data-key");
            if (key) {
              onChange(key);
            }
          });

          // ダークモード切替ボタン
          d3.select("#toggleTheme").on("click", () => {
            document.body.classList.toggle("dark-mode");
          });
        })
        .catch((error) => {
          console.error("データの読み込みエラー:", error);
        });
    </script>
  </body>
</html>
