<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>完成 | d3.js</title>
  <style>
    body {
      margin: 0;
    }

    svg {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script>
    d3.json("./data.json")
      .then((dataset) => {
        const padding = 20;
        const max = d3.max(dataset, (data) => data.val);

        const scale = d3.scaleLinear()
          .domain([0, max])
          .range([0, 300]);

        const svg = d3.select("body")
          .append("svg")
          .attr("viewBox", "0 0 500 300");

        const g = svg.selectAll(".item")
          .data(dataset)
          .enter()
          .append("g")
          .classed("item", true)
          .attr("transform", (data, index) => `translate(${padding},${index * 90 + padding})`);

        g.append("rect")
          .attr("width", 0)
          .attr("height", 20)
          .attr("x", 110)
          .attr("y", 35)
          .attr("fill", (data) => data.color)
          .transition()
          .duration(1000)
          .delay((data, index) => index * 500)
          .ease(d3.easeExpIn)
          .attr("width", (data) => scale(data.val));

        g.append("text")
          .classed("label", true)
          .text((data) => data.label)
          .attr("font-size", "14px")
          .attr("x", 110)
          .attr("y", 20);

        g.append("text")
          .classed("val", true)
          .text((data) => data.val)
          .attr("font-size", "14px")
          .attr("x", 110)
          .attr("y", 50)
          .transition()
          .duration(1000)
          .delay((data, index) => index * 500)
          .ease(d3.easeExpIn)
          .attr("x", (data) => 110 + scale(data.val));

        g.append("image")
          .attr("href", (data) => data.url)
          .attr("width", 100);
      })
      .catch((error) => {
      });
  </script>
</body>
</html>
