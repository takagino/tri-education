<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        svg {
            background-color: #f1f1f3;
        }
    </style>
</head>

<body>
    <div id="container">

    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        d3.select("#container").append("h1").text("週間　YouTubeチャート").style("color", "#484848");

        d3.select("#container").append("h3").text("集計期間：2024年11月29日～2024年12月05日").style("color", "#484848")

        const dataset = [
            { title: "APT. ロゼ＆ブルーノ・マーズ", num: 664.6 },
            { title: "オトノケ　Creepy Nuts", num: 555.5 },
            { title: "ビターバカンス Mrs.GREEN APPLE", num: 521.3 },
            { title: "ライラック Mrs.GREEN APPLE", num: 512.2 },
            { title: "はいよろこんで こっちのけんと", num: 458.3 }];


        const width = 640;
        const height = 480;

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height);

        svg.selectAll('.rect')
            .data(dataset)
            .enter()
            .append("rect")
            .classed("rect", true) //クラス名を追加
            .attr("x", 0)
            .attr("y", (data, index) => index * 70 + 20)
            .attr("width", (data) => data.num - 100)
            .attr("height", 20)
            .attr('fill', '#6996C2');

        svg.selectAll("text")
            .data(dataset)
            .enter()
            .append("text")
            .classed("title", true) //クラス名を追加
            .attr("font-size", "14")
            .attr("x", (data) => data)
            .attr("y", (data, index) => index * 70 + 14)
            .text((data, index) => `${index + 1}位 ${data.title}`)
            .style("color", "#484848");


        svg.selectAll('.num')
            .data(dataset)
            .enter()
            .append("text")
            .classed("num", true) //クラス名を追加
            .attr("font-size", "12")
            .attr("x", (data) => data)
            .attr("y", (data, index) => index * 70 + 40)
            .text((data) => `${data.num}万回再生`)
            .style("color", "#484848");

        container.append(svg.node());
    </script>
</body>

</html>
