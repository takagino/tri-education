<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>d3.js</title>
    <style>
      svg {
        background-color: #ddd;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">日本国内一日乗降者数ランキング</h1>
    <div id="container" style="text-align: center"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      const dataset = [
        { title: "新宿駅", num: 2945119 },
        { title: "渋谷駅", num: 2803542 },
        { title: "池袋駅", num: 2308170 },
        { title: "横浜駅", num: 1962409 },
        { title: "北千住駅", num: 1388227 },
      ];
      const width = 840;
      const height = 680;

      const svg = d3.create("svg").attr("width", width).attr("height", height);

      // 棒グラフの描画
      svg
        .selectAll("rect")
        .data(dataset)
        .enter()
        .append("rect")
        .attr("x", 0)
        .attr("y", (data, index) => index * 90)
        .attr("width", (data) => data.num / 10000)
        .attr("height", 50)
        .attr("fill", (data) => {
          if (data.num > 2000000) {
            return "#ff0000";
          } else if (data.num > 1500000) {
            return "#ff8000";
          } else if (data.num > 1000000) {
            return "#ffff00";
          } else {
            return "#00ff00";
          }
        });

      // 駅名の描画
      svg
        .selectAll(".title")
        .data(dataset)
        .enter()
        .append("text")
        .classed("title", true) // クラス名を追加
        .attr("font-size", "14")
        .attr("x", 5) // グラフの左端付近に固定
        .attr("y", (data, index) => index * 90 + 15) // 棒グラフの上部に揃える
        .text((data, index) => `${index + 1}位 ${data.title}`);

      // 乗り降り数の描画（グラフの横）
      svg
        .selectAll(".num")
        .data(dataset)
        .enter()
        .append("text")
        .classed("num", true) // クラス名を追加
        .attr("font-size", "14")
        .attr("x", (data) => data.num / 10000 + 10) // グラフの右端+10pxに配置
        .attr("y", (data, index) => index * 90 + 15) // 棒グラフと縦位置を合わせる
        .text((data) => `${data.num}人`);

      // SVGをコンテナに追加
      container.append(svg.node());
    </script>
  </body>
</html>
