<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        svg {
            background-color: transparent;
            ;
        }

        html {
            font-size: 16px;
        }

        body {
            background-color: #333;
            color: #fefefe;
            padding: 5em 0;
            margin: 0;
        }

        body::before {
            border-color: #FA5E00 transparent transparent transparent;
            border-style: solid;
            border-width: 90px 100vw 0 0;
            top: 0;
            content: "";
            height: 0;
            position: absolute;
        }

        text {
            fill: #fefefe;
        }

        .num {
            font-size: 16px;
        }

        img {
            width: 20%;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 3em;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        #container {
            text-align: center;
        }

        rect {
            animation: animebar 1s ease forwards;
        }

        rect:nth-child(2) {
            animation-delay: .1s;
        }

        rect:nth-child(3) {
            animation-delay: .2s;
        }

        rect:nth-child(4) {
            animation-delay: .3s;
        }

        rect:nth-child(4) {
            animation-delay: .4s;
        }

        rect:nth-child(5) {
            animation-delay: .5s;
        }



        @keyframes animebar {
            0% {
                width: 0;
            }
        }
    </style>
</head>

<body>
    <h1><img src="./m1.png" alt=""><br>歴代得点ランキングTOP5</h1>
    <div id="container">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const dataset = [
            { title: "ミルクボーイ", num: 681 / 3 },
            { title: "アンタッチャブル", num: 673 / 3 },
            { title: "笑い飯", num: 668 / 3 },
            { title: "さや香", num: 667 / 3 },
            { title: "オズワルド", num: 665 / 3 }
        ]; const width = 640;
        const height = 480;


        const svg = d3.create("svg").attr("width", width).attr("height", height);

        svg.selectAll('rect')
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", 0)
            .attr("y", (data, index) => index * 70 + 35)
            .attr("width", (data) => data.num) //ドットで繋げて指定する
            .attr("height", 20)
            .attr('fill', '#FA5E00');


        //クラス名で取得
        svg.selectAll('.title')
            .data(dataset)
            .enter()
            .append("text")
            .classed("title", true) //クラス名を追加
            .attr("font-size", "14")
            .attr("x", (data) => data)
            .attr("y", (data, index) => index * 70 + 24)
            .text((data, index) => `${index + 1}位 ${data.title}`);

        svg.selectAll('.num')
            .data(dataset)
            .enter()
            .append("text")
            .classed("num", true) //クラス名を追加
            .attr("font-size", "12")
            .attr("x", (data) => data.num + 16)
            .attr("y", (data, index) => index * 70 + 52)
            .text((data) => `${data.num * 3}点`);

        container.append(svg.node());
    </script>
</body>

</html>
