<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>d3.js</title>
    <style>
      svg {
        background-color: #ddd;
      }
    </style>
  </head>
  <style>
    svg {
      margin: 0 auto;
      display: block;
    }
  </style>
  <body>
    <h1>槇原敬之売上曲ランキングTOP5</h1>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      const dataset = [
        { title: "どんなときも。", num: 167.0 },
        { title: "もう恋なんてしない", num: 139.7 },
        { title: "SPY", num: 86.6 },
        { title: "冬がはじまるよ", num: 76.2 },
        { title: "No.1", num: 68.0 },
        { title: "北風 ～君にとどきますように～", num: 62.7 },
      ];
      const width = 640;
      const height = 480;

      const svg = d3.create("svg").attr("width", width).attr("height", height);

      svg
        .selectAll("rect")
        .data(dataset)
        .enter()
        .append("rect")
        .attr("x", 0)
        .attr("y", (data, index) => index * 70 + 20)
        //widthの数値を1.5倍にする
        .attr("width", (data) => data.num * 3)

        .attr("height", 30)
        .attr("fill", "#ff8866");

      svg
        .selectAll(".title")
        .data(dataset)
        .enter()
        .append("text")
        .classed("title", true)
        .attr("font-size", "14")
        .attr("x", (data) => data)
        .attr("y", (data, index) => index * 70 + 14)
        .text((data, index) => `${index + 1}位 ${data.title}`);

      svg
        .selectAll(".num")
        .data(dataset)
        .enter()
        .append("text")
        .classed("num", true)
        .attr("font-size", "12")
        .attr("x", (data) => data.num - 12)
        .attr("y", (data, index) => index * 70 + 40)
        .text((data) => `${data.num}万枚`);

      container.append(svg.node());
    </script>
  </body>
</html>
