  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    const dataset = [
      { title: "インフェルノ",num: 280 },
      { title: "青と夏",num: 170 },
      { title: "ダンスホール",num: 110 },
      { title: "僕のこと",num: 110 },
      { title: "ロマンチシズム",num: 80 }
    ];

    const width = 640;
    const height = 480;

    const svg = d3.create("svg")
      .attr("width",width)
      .attr("height",height);

    svg.selectAll('rect')
      .data(dataset)
      .enter()
      .append("rect")
      .attr("x",0)
      .attr("y",(data,index) => index * 70 + 20)
      .attr("width",(data) => data.num)
      .attr("height",20)
      .attr('fill','#fff');

    svg.selectAll('.title')
      .data(dataset)
      .enter()
      .append("text")
      .classed("title",true)
      .attr("font-size","14")
      .attr("x",0)
      .attr("y",(data,index) => index * 70 + 14)
      .text((data,index) => `${index + 1}位 ${data.title}`)
      .attr('fill','#fff');

    svg.selectAll('.num')
      .data(dataset)
      .enter()
      .append("text")
      .classed("num",true)
      .attr("font-size","12")
      .attr("x",(data) => data.num + 10)
      .attr("y",(data,index) => index * 70 + 35)
      .text((data) => `${data.num / 100}億回数`)
      .attr('fill','#fff');
