<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        h1 {
            text-align: center;
        }

        #container {
            width: 640px;
            margin: auto;
        }

        svg {
            padding: 10px 0;
            background-color: #ddd;
        }
    </style>
</head>

<body>
    <h1>ランキングTOP5</h1>
    <div id="container">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const dataset = [
            { title: "名探偵コナン 100万ドルの五稜星", num: 157.1 },
            { title: "劇場版ハイキュー!! ゴミ捨て場の決戦", num: 115.1 },
            { title: "キングダム 大将軍の帰還", num: 79.8 },
            { title: "ゴジラ-1.0", num: 75.9 },
            { title: "劇場版 SPY×FAMILY CODE:White", num: 62.6 }
        ];
        const width = 640;
        const height = 480;

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height);

        svg.selectAll('rect')
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", 0)
            .attr("y", (data, index) => index * 70 + 20)
            .attr("width", (data) => data.num)
            .attr("height", 20)
            .attr('fill', '#ffff00');

        svg.selectAll('.title')
            .data(dataset)
            .enter()
            .append("text")
            .classed("title", true)
            .attr("font-size", "14")
            .attr("x", (data) => data)
            .attr("y", (data, index) => index * 70 + 14)
            .text((data, index) => `${index + 1}位 ${data.title}`);

        svg.selectAll('.num')
            .data(dataset)
            .enter()
            .append("text")
            .classed("num", true)
            .attr("font-size", "12")
            .attr("x", (data) => data.num - 12)
            .attr("y", (data, index) => index * 70 + 40)
            .text((data) => `${data.num}億円`);

        container.append(svg.node());
    </script>
</body>

</html>
