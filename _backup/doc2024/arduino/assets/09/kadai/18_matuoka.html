<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        svg {
            background-color: #ddd;
        }
    </style>
</head>

<body>
    <h1>セントラル・リーグ本塁打ランキング</h1>
    <div id="container">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const dataset = [
            { title: "村上 宗隆 （ヤ）	", num: 33, color: "#84C98B" },
            { title: "岡本 和真 （巨）	", num: 27, color: "#ff6600" },
            { title: "オースティン （デ）", num: 25, color: "#003f8e" },
            { title: "牧 秀悟 （デ）", num: 23, color: "#003f8e" },
            { title: "細川 成也 （中）", num: 23, color: "#245da3" },
            { title: "サンタナ （ヤ）", num: 17, color: "#84C98B" }
        ];
        const width = 640;
        const height = 480;

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height);

        svg.selectAll('rect')
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", 0)
            .attr("y", (data, index) => index * 70 + 20)
            .attr("width", (data) => data.num * 15)
            .attr("height", 20)
            .attr('fill', (data) => data.color);

        svg.selectAll('.title')
            .data(dataset)
            .enter()
            .append("text")
            .classed("title", true)
            .attr("font-size", "14")
            .attr("x", (data) => data)
            .attr("y", (data, index) => index * 70 + 14)
            .text((data, index) => `${index + 1}位 ${data.title}`);

        svg.selectAll('.num')
            .data(dataset)
            .enter()
            .append("text")
            .classed("num", true)
            .attr("font-size", "12")
            .attr("x", (data) => data.num - 12)
            .attr("y", (data, index) => index * 70 + 40)
            .text((data) => `${data.num}本塁打`);

        container.append(svg.node());
    </script>
</body>

</html>
