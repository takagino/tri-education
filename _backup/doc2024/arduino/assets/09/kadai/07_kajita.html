<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        svg {
            background-color: #ddd;
            margin: 20px auto;
            display: block;
        }

        text {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>2024アニメランキング</h1>
    <div id="container">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const dataset = [
            { title: "ダンダダン", num: 47 },
            { title: "負けヒロインが多すぎる！", num: 46 },
            { title: "転生したらスライムだった件 (第3期)", num: 26 },
            { title: "ガールズバンドクライ", num: 25 },
            { title: "僕の心のヤバイやつ（第二期）", num: 22 }
        ];
        const width = 640;
        const height = 500;
        const barHeight = 30;
        const barSpacing = 20;
        const colors = ["#FF5733", "#33FF57", "#3357FF", "#FF33A1", "#FFA533"];

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height);

        // Bars
        svg.selectAll('rect')
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", 0)
            .attr("y", (data, index) => index * (barHeight + barSpacing) + barSpacing)
            .attr("width", (data) => data.num * 12) // Scale the width for better visualization
            .attr("height", barHeight)
            .attr('fill', (data, index) => colors[index]);

        // Titles
        svg.selectAll('.title')
            .data(dataset)
            .enter()
            .append("text")
            .classed("title", true)
            .attr("x", 5)
            .attr("y", (data, index) => index * (barHeight + barSpacing) + barSpacing + 20)
            .attr("font-size", "14")
            .attr("fill", "#000")
            .text((data, index) => `${index + 1}位 ${data.title}`);

        // Votes
        svg.selectAll('.num')
            .data(dataset)
            .enter()
            .append("text")
            .classed("num", true)
            .attr("x", (data) => data.num * 10 + 15)
            .attr("y", (data, index) => index * (barHeight + barSpacing) + barSpacing + 20)
            .attr("font-size", "12")
            .attr("fill", "#000")
            .text((data) => `${data.num}票`);

        // Append to container
        document.getElementById("container").append(svg.node());
    </script>
</body>

</html>
