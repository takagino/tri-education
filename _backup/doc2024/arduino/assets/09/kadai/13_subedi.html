<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        body {
            font-family: Arial, sans-serif;

            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            margin-top: 20px;
            font-size: 24px;
            color: #1e3a8a;
        }

        .chart-container {
            margin-top: 30px;
            width: 80%;
        }

        svg {
            width: 100%;
            height: auto;
            border: 2px solid #ddd;
            background-color: #ffffff;
        }

        text {
            fill: #333;
        }

        .num {
            fill: #ff0000;
        }

        .bar {
            fill: #b22222;
        }

        .title {
            fill: #333333;
        }
    </style>
</head>

<body>

    <h1>「マーベル映画 全世界興行収入トップ5」</h1>
    <div class="chart-container" id="chart"></div>

    <script src="https://d3js.org/d3.v6.min.js"></script>
    <script>
        const dataset = [
            { title: "アベンジャーズ／エンドゲーム (2019)", num: 4000 },
            { title: "アベンジャーズ／インフィニティ・ウォー (2018)", num: 2900 },
            { title: "スパイダーマン：ノー・ウェイ・ホーム (2021)", num: 2700 },
            { title: "ブラックパンサー (2018)", num: 1900 },
            { title: "アベンジャーズ (2015)", num: 2000 }
        ];

        const width = 640;
        const height = 480;

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height);


        svg.selectAll('rect')
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", 1)
            .attr("y", (data, index) => index * 70 + 50)
            .attr("width", 0) // Initially width is 0 for animation effect
            .attr("height", 20)
            .attr('class', 'bar')
            .transition()
            .duration(1500)
            .attr("width", (data) => data.num * 0.15);

        svg.selectAll('.title')
            .data(dataset)
            .enter()
            .append("text")
            .classed("title", true)
            .attr("font-size", "14")
            .attr("x", (data) => data.num * 0.001 + 10)
            .attr("y", (data, index) => index * 70 + 45)
            .attr("opacity", 0) // Initially hidden
            .text((data, index) => `${index + 1}位 ${data.title}`)
            .transition()
            .duration(1500)
            .attr("opacity", 1);

        svg.selectAll('.num')
            .data(dataset)
            .enter()
            .append("text")
            .classed("num", true)
            .attr("font-size", "12")
            .attr("x", (data) => data.num * 0.15 - 12)
            .attr("y", (data, index) => index * 72 + 40)
            .attr("fill", "red")
            .attr("opacity", 0) // Initially hidden
            .text((data) => `${data.num}億円`)
            .transition()
            .duration(1500)
            .attr("opacity", 1);

        document.getElementById("chart").appendChild(svg.node());

    </script>
</body>

</html>
