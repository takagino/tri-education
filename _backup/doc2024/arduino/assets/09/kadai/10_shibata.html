<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        svg {
            background-color: #eeeeee;
            border: solid 5px #c4c4c4;
            border-radius: 20px;
            margin: 20px;
            padding: 20px 40px 0 40px;
        }
    </style>
</head>

<body>
    <div id="container">
        <h1>BATTLEFIELDシリーズ　国内販売数（パッケージのみ・PC含まれず）</h1>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const dataset = [
            { title: "BATTLEFIELD 1", num: 272.167 },
            { title: "BATTLEFIELD 4", num: 237.581 },
            { title: "BATTLEFIELD 3", num: 206.034 },
            { title: "BATTLEFIELD V", num: 209.464 },
            { title: "BATTLEFIELD BatCampany2", num: 81.760 }
        ];
        const width = 640;
        const height = 380;

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height);

        svg.selectAll('rect')
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", 0)
            .attr("y", (data, index) => index * 70 + 20)
            .attr("width", (data) => data.num)
            .attr("height", 20)
            .attr('fill', '#ff0000');

        svg.selectAll('.title')
            .data(dataset)
            .enter()
            .append("text")
            .classed("title", true)
            .attr("font-size", "14")
            .attr("x", (data) => data)
            .attr("y", (data, index) => index * 70 + 14)
            .text((data, index) => `${index + 1}位 ${data.title}`);

        svg.selectAll('.num')
            .data(dataset)
            .enter()
            .append("text")
            .classed("num", true)
            .attr("font-size", "12")
            .attr("x", (data) => data.num - 20)
            .attr("y", (data, index) => index * 70 + 60)
            .text((data) => `${data.num}本`);

        container.append(svg.node());
    </script>
</body>

</html>
