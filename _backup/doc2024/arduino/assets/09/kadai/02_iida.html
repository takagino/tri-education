<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>d3.js</title>
    <style>
      svg {
        background-color: #f8f9fa;
      }
      h1 {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Spotify週間再生数ランキング</h1>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
      const dataset = [
        { title: "APT.", num: 382582 },
        { title: "ライラック", num: 336032 },
        { title: "Running Wild", num: 307500 },
        { title: "Who", num: 285072 },
        { title: "ビターバカンス", num: 284981 },
      ];

      const width = 960;
      const height = 480;

      const svg = d3.create("svg").attr("width", width).attr("height", height);

      const xScale = d3
        .scaleLinear()
        .domain([0, d3.max(dataset, (d) => d.num)])
        .range([0, width * 0.8]);

      svg
        .selectAll("rect")
        .data(dataset)
        .enter()
        .append("rect")
        .attr("x", 0)
        .attr("y", (data, index) => index * 70 + 20)
        .attr("width", (data) => xScale(data.num))
        .attr("height", 20)
        .attr("fill", "#1DB954");

      svg
        .selectAll(".title")
        .data(dataset)
        .enter()
        .append("text")
        .classed("title", true)
        .attr("font-size", "12")
        .attr("x", (data) => xScale(data.num) + 5)
        .attr("y", (data, index) => index * 70 + 14)
        .text((data, index) => `${index + 1}位 ${data.title}`);

      svg
        .selectAll(".num")
        .data(dataset)
        .enter()
        .append("text")
        .classed("num", true)
        .attr("font-size", "10")
        .attr("x", (data) => xScale(data.num) - 5)
        .attr("y", (data, index) => index * 70 + 40)
        .text((data) => `${data.num}再生`);

      container.append(svg.node());
    </script>
  </body>
</html>
