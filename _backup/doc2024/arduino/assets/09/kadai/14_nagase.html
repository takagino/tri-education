<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3.js</title>
    <style>
        h1 {
            font-family: 'Times New Roman', Times, serif;
            width: 640px;
            margin: 20px auto 30px;
        }

        svg {
            background-color: #fff;
            border: 1px #000 solid;
            padding: 20px;
        }

        #container {
            width: 640px;
            margin: auto;
        }

        .reference {
            width: 640px;
            margin: 50px auto;
        }
    </style>
</head>

<body>
    <h1>人気猫種ランキングTOP5</h1>
    <div id="container">
        <!-- <ul>
            <li>リストです。</li>
            <li>リストです。</li>
        </ul> -->
    </div>
    <p class="reference">参考：https://prtimes.jp/main/html/rd/p/000000139.000028421.html</p>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script>
        const dataset = [
            { title: "スコティッシュ・フォールド", num: 7811 },
            { title: "混血猫", num: 6154 },
            { title: "マンチカン", num: 5891 },
            { title: "ラグドール", num: 4433 },
            { title: "ミヌエット", num: 3905 }
        ];
        const width = 640;
        const height = 330;

        const svg = d3.create("svg")
            .attr("width", width)
            .attr("height", height);

        svg.selectAll('rect')
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", 0)
            .attr("y", (data, index) => index * 70 + 20)
            .attr("width", (data) => data.num / 20)
            .attr("height", 20)
            .attr('fill', '#6ea7e0');

        svg.selectAll('.title')
            .data(dataset)
            .enter()
            .append("text")
            .classed("title", true)
            .attr("font-size", "14")
            .attr("x", (data) => data)
            .attr("y", (data, index) => index * 70 + 14)
            .text((data, index) => `${index + 1}位 ${data.title}`);

        svg.selectAll('.num')
            .data(dataset)
            .enter()
            .append("text")
            .classed("num", true)
            .attr("font-size", "13")
            .attr("x", (data) => data.num / 19)
            .attr("y", (data, index) => index * 70 + 35)
            .attr('fill', '#db260d')
            .text((data) => `${data.num}頭`);

        container.append(svg.node());
    </script>
</body>

</html>
