      const width = 640;
      const height = 480;

      const svg = d3.create("svg").attr("width", width).attr("height", height);

      svg
        .selectAll("rect")
        .data(dataset)
        .enter()
        .append("rect")
        .attr("x", 0)
        .attr("y", (data, index) => index * 70 + 20)
        .attr("width", (data) => data.num)
        .attr("height", 30)
        .attr("fill", "#ffadf0");

      svg
        .selectAll(".title")
        .data(dataset)
        .enter()
        .append("text")
        .classed("title", true)
        .attr("font-size", "16")
        .attr("x", (data) => data)
        .attr("y", (data, index) => index * 70 + 14)
        .text((data, index) => `${index + 1}位 ${data.title}`);

      svg
        .selectAll(".num")
        .data(dataset)
        .enter()
        .append("text")
        .classed("num", true)
        .attr("font-size", "12")
        .attr("x", (data) => data.num - 12)
        .attr("y", (data, index) => index * 70 + 40)
        .text((data) => `${data.num}万枚`);
