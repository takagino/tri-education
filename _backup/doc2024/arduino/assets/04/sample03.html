<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>p5.js</title>
  <style>
    canvas {
      background-color: #ddd;
      border: 1px solid #aaa;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.min.js"></script>
  <script>
    let obj = {
      x: 0,
      y: 0
    };

    function setup() {
      createCanvas(640, 480);
      colorMode(HSL);
      noStroke();
      // rectMode(CENTER);
    }

    function draw() {
      // clear();

      fill("#ff0000");
      rect(0, obj.y, 640, 20);
      obj.y += 40;

      fill("#0000ff");
      rect(obj.x, 0, 20, 480);
      obj.x += 40;
    }
  </script>
</body>
</html>
