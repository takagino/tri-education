<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>



    <style>
        /* Google Fonts 読み込み */
        @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap");

        body {
            margin: 0;
            background-image: url(./space-background-realistic-starry-night-cosmos-shining-stars-milky-way-stardust-color-galaxy.jpg);
        }

        /* 全体を囲うコンテナー */
        .container {
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            font-size: 3rem;
            text-align: center;
            line-height: 1.2;
            margin: 0;
            padding: 50px;
            color: transparent;
            background: linear-gradient(to right, #12d404, #4f39dd);
            -webkit-background-clip: text;
            background-clip: text;
            text-shadow: 3px 3px 3px rgba(0, 0, 0, 0.2);


        }


        .clock {
            font-family: 'Share Tech Mono', monospace;
            color: linear-gradient(to right, #ff7e5f, #feb47b);

            margin: 175px;
            padding: 150px;


            line-height: 1.2;
            text-align: center;
            text-shadow: 3px 3px 3px;

        }

        /* 日付のスタイル */
        .clock-date {
            font-size: 25px;

        }

        /* 時間のスタイル */
        .clock-time {
            font-size: 100px;
            margin: 0;
        }

        /* 文字サイズ調整 */
        @media screen and (max-width: 500px) {


            .clock-date {
                font-size: 5vw;
            }

            .clock-time {
                font-size: 20vw;
            }


        }
    </style>
</head>

<body>
    <div class="container">
        <div class="clock">
            <p class="clock-date"></p>
            <p class="clock-time"></p>
        </div>
    </div>

    <div></div>
    <script>

        const clock = () => {
            // 現在の日時・時刻の情報を取得
            const d = new Date();

            // 年を取得
            let year = d.getFullYear();
            // 月を取得
            let month = d.getMonth() + 1;
            // 日を取得
            let date = d.getDate();
            // 曜日を取得
            let dayNum = d.getDay();
            const weekday = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            let day = weekday[dayNum];
            // 時を取得
            let hour = d.getHours();
            // 分を取得
            let min = d.getMinutes();
            // 秒を取得
            let sec = d.getSeconds();

            // 1桁の場合は0を足して2桁に
            month = month < 10 ? "0" + month : month;
            date = date < 10 ? "0" + date : date;
            hour = hour < 10 ? "0" + hour : hour;
            min = min < 10 ? "0" + min : min;
            sec = sec < 10 ? "0" + sec : sec;

            // 日付・時刻の文字列を作成
            let today = `${year}.${month}.${date} ${day}`;
            let time = `${hour}:${min}:${sec}`;

            // 文字列を出力
            document.querySelector(".clock-date").innerText = today;
            document.querySelector(".clock-time").innerText = time;
            setInterval(clock, 1000 - d.getMilliseconds());
        };

        clock();



    </script>
</body>

</html>
