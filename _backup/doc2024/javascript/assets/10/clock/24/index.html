<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタル時計</title>
</head>

<style>
    body {
        margin: 0;
    }

    img {
        vertical-align: bottom;
        height: auto;
        max-width: 100%;
    }

    .container {
        width: 100%;
        height: 100vh;
        background-color: #f7daf7;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .heart {
        width: 200px;
    }

    .box {
        background-color: #fffeff;
    }

    .flex {
        display: flex;
        align-items: center;
    }

    /* 時計の共通スタイル */
    .clock {
        font-family: 'Share Tech Mono', monospace;
        color: #fffeff;
        text-shadow: 0 0 20px #ff00e1;
        line-height: 1.2;
        text-align: center;
    }

    /* 日付のスタイル */
    .clock-date {
        font-size: 25px;
        margin-bottom: -8px;
    }

    /* 時間のスタイル */
    .clock-time {
        font-size: 100px;
        margin: 0;
    }

    /* 文字サイズ調整 */
    @media screen and (max-width: 500px) {
        .clock-date {
            font-size: 5vw;
        }

        .clock-time {
            font-size: 20vw;
        }
    }
</style>

<body>
    <div class="box">
        <div class="container">
            <div class="clock">
                <p class="clock-date"></p>
                <div class="flex">
                    <img class="heart" src="f815b342af4926d06599035a3a9f4eae.png" alt="">
                    <p class="clock-time"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const heart = document.querySelector(".heart");

        const clock = () => {
            const d = new Date();

            let year = d.getFullYear();
            let month = d.getMonth() + 1;
            let date = d.getDate();
            let dayNum = d.getDay();
            const weekday = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            let day = weekday[dayNum];
            let hour = d.getHours();
            let min = d.getMinutes();
            let sec = d.getSeconds();




            // 1桁の場合は0を足して2桁に
            month = month < 10 ? "0" + month : month;
            date = date < 10 ? "0" + date : date;
            hour = hour < 10 ? "0" + hour : hour;
            min = min < 10 ? "0" + min : min;
            sec = sec < 10 ? "0" + sec : sec;

            // 日付・時刻の文字列を作成
            let today = `${year}.${month}.${date} ${day}`;
            let time = `${hour}:${min}:${sec}`;

            // ハートのアニメーション
            if (sec % 2 == 0) {
                heart.style.opacity = 0.3;
            } else {
                heart.style.opacity = 1;
            }

            // 背景色の変更（18時から4時の間）
            if (hour >= 18 || hour < 4) {
                document.body.style.backgroundColor = "#8569b5";
            } else {
                document.body.style.backgroundColor = "#f7daf7"; // デフォルトの背景色
            }

            // 文字列を出力
            document.querySelector(".clock-date").innerText = today;
            document.querySelector(".clock-time").innerText = time;

            // 時間の更新
            setTimeout(clock, 1000 - d.getMilliseconds());
        };

        //clockという命令を最初に実行する、その後にsetTimeoutを実行▶︎ラグがなくなる
        clock();
    </script>
</body>

</html>
