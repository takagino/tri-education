<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デジタル時計</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/the-new-css-reset/css/reset.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Kumar+One&family=Moo+Lah+Lah&family=Noto+Serif+JP:wght@200..900&family=Vina+Sans&family=Waterfall&display=swap"
        rel="stylesheet">

    <style>
        /* Google Fonts 読み込み */
        /* @import url("https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"); */

        body {
            background-image: url(./pink.png);
            font-weight: 900;
            font-style: normal;
        }


        /* 全体を囲うコンテナー */
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* 時計の共通スタイル */
        .clock {
            font-family: "Bodoni Moda", serif;
            font-size: 50px;
            text-align: center;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
            margin: 20px 0px 20px 10px;
            position: relative;
            font-weight: 600;
            font-style: normal;
            background-image: linear-gradient(50deg,
                    rgb(211, 209, 209, 0.3) 45%,
                    #fff 50%,
                    rgb(211, 209, 209, 0.3) 55%);
            background-size: 500% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: shine 5s infinite;
            transition: .5s cubic-bezier(0.45, 0, 0.55, 1);
            letter-spacing: 0.15em;
        }

        @keyframes shine {
            0% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        .clock:hover {
            letter-spacing: 0.30em;
        }



        /* 日付のスタイル */
        .clock-date {
            margin-bottom: 30px;
            font-size: 30px;
        }

        /* 時間のスタイル */
        .clock-time {
            font-size: 100px;
        }




        /* 文字サイズ調整 */
        @media screen and (max-width: 500px) {
            .clock-date {
                font-size: 5vw;
            }

            .clock-time {
                font-size: 20vw;
            }
        }


        .neko {
            animation-name: nuko;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-duration: 1.3s;
            margin-top: -900px;
            width: 500px;
        }

        @keyframes nuko {
            0% {
                transform: translate(0, 0px);
            }

            100% {
                transform: translate(0, -40px)
            }
        }

        .bin {
            margin-left: 1030px;
            margin-top: -1200px;
            animation-name: nuko;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-duration: 1.3s;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="clock">
            <p class="clock-date"></p>
            <p class="clock-time"></p>
        </div>

    </div>
    <img class="bin" src="./bing.png" alt="">
    <img class="neko" src="./—Pngtree—cat plush_7220116.png" alt="">
    <script>
        const clock = () => {
            //現在の日時・時刻の情報を取得
            const d = new Date();

            //年を取得
            let year = d.getFullYear();

            //月を取得
            let month = d.getMonth() + 1;

            //日を取得
            let date = d.getDate();

            //曜日を取得
            let dayNum = d.getDay();
            const weekday = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            let day = weekday[dayNum];

            //時を取得
            let hour = d.getHours();

            //分を取得
            let min = d.getMinutes();

            //秒を取得
            let sec = d.getSeconds();

            // 1桁の場合は0を足して2桁に
            month = month < 10 ? "0" + month : month;
            date = date < 10 ? "0" + date : date;
            hour = hour < 10 ? "0" + hour : hour;
            min = min < 10 ? "0" + min : min;
            sec = sec < 10 ? "0" + sec : sec;

            // 日付・時刻の文字列を作成
            let today = `${year}.${month}.${date} ${day}`;
            let time = `${hour}:${min}:${sec}`;

            // 文字列を出力
            document.querySelector(".clock-date").innerText = today;
            document.querySelector(".clock-time").innerText = time;

            setTimeout(clock, 1000 - d.getMilliseconds());
        };

        //一秒ごとにclock関数を呼び出す
        clock();
    </script>

</body>

</html>
