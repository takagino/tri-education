<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡単なスライドショー</title>
  <style>
    ul {
      padding-left: 0;
      list-style: none;
    }

    .slide {
      position: relative;
      width: 500px;
      margin: auto;
    }

    .slide__item {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .slide__item.active {
      position: relative;
      opacity: 1;
    }

    .btn {
      display: flex;
      justify-content: center;
    }

    .btn__item {
      width: 20px;
      height: 20px;
      margin: 0 10px;
      border-radius: 50%;
      background-color: #ccc;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <ul class="slide">
    <li class="slide__item"><img src="https://placehold.jp/3d4070/ffffff/500x300.png?text=1" alt=""></li>
    <li class="slide__item"><img src="https://placehold.jp/703e3e/ffffff/500x300.png?text=2" alt=""></li>
    <li class="slide__item"><img src="https://placehold.jp/59703e/ffffff/500x300.png?text=3" alt=""></li>
  </ul>
  <ul class="btn">
  </ul>

  <script>
    //変数宣言
    let timer;
    let active = 0;
    const speed = 3000;

    //要素の取得
    const slide = document.querySelector('.slide');
    const slideItem = document.querySelectorAll('.slide__item');
    const btn = document.querySelector('.btn');

    //個別ボタンの追加
    slideItem.forEach((item, i) => {
      let btnItem = document.createElement('li');
      btnItem.classList.add('btn__item');
      btnItem.addEventListener('click', () => {
        changeSlide(i);
      });
      btn.appendChild(btnItem);
    });

    //スライドを切り替える関数
    const changeSlide = function (num) {
      clearInterval(timer);
      timer = setInterval(timerSlide, speed);

      slideItem[active].classList.remove('active');

      active = num;
      if (active < 0) {
        active = slideItem.length - 1;
      } else if (active > slideItem.length - 1) {
        active = 0;
      }

      slideItem[active].classList.add('active');
    }

    //タイマーにセットするための関数
    const timerSlide = function () {
      changeSlide(active + 1);
    };

    //マウスオーバーした際のイベント
    slide.addEventListener('mouseover', function () {
      clearInterval(timer);
    });

    //マウスアウトした際のイベント
    slide.addEventListener('mouseout', function () {
      timer = setInterval(timerSlide, speed);
    });

    //初期設定
    slideItem[active].classList.add('active');
    timer = setInterval(timerSlide, speed);

  </script>
</body>
</html>
