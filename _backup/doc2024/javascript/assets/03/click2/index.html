<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリックゲームその2</title>
</head>
<body>
    <img id="monster" src="https://trident.takagino.net/doc2022/javascript/assets/03/monster.png">
    <p id="hp"></p>

    <script>
        const monster = document.getElementById('monster');
        const hp = document.getElementById('hp');

        let count = 0;
        hp.innerHTML = `${count}回`;

        monster.addEventListener('click', function () {
            if (count < 30) {
                count += 1;
                if (count == 10) {
                    hp.innerHTML = '10回達成、おめでとう！'
                } else if (count == 20) {
                    hp.innerHTML = '20回達成、おめでとう！'
                } else if (count == 30) {
                    hp.innerHTML = '30回クリア！おめでとう！'
                } else {
                    hp.innerHTML = `${count}回`;
                }
            }
        });
    </script>
</body>

</html>
