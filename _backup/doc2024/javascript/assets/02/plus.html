<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字を変化させる</title>
</head>
<body>
  <button id="plus">+</button>

  <script>
    let num = 0;
    const plusBtn = document.getElementById('plus');
    plusBtn.addEventListener('click', function () {
      num = num + 1;
      console.log(num);
    });
  </script>
</body>
</html>
