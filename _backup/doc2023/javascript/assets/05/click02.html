<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実践その1</title>
  <style>
  </style>
</head>
<body>
  <button id="bai">2倍</button>

  <script>
    class Button {
      constructor() {
        this.num = 0;

        this.btn = document.createElement("button");
        this.btn.textContent = this.num;
        this.btn.addEventListener('click', () => {
          this.num++;
          this.btn.textContent = this.num;
        });
        document.body.appendChild(this.btn);
      }

      bai() {
        this.num *= 2;
        this.btn.textContent = this.num;
      }
    };

    const btn = new Button();

    const bai = document.querySelector('#bai');
    bai.addEventListener('click', () => {
      btn.bai();
    });
  </script>
</body>
</html>
