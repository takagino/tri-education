<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実践その2</title>
  <style>
    .circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #09c;
      opacity: .5;
      position: absolute;
    }
  </style>
</head>
<body>

  <script>
    class Circle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.timerId;

        this.circle = document.createElement("div");
        this.circle.classList.add("circle");
        this.circle.style.left = `${this.x}px`;
        this.circle.style.top = `${this.y}px`;
        document.body.appendChild(this.circle);
      }

      move() {
        this.timerId = setInterval(() => {
          let ranX = Math.floor(Math.random() * 3) - 1;
          let ranY = Math.floor(Math.random() * 3) - 1;

          this.x += ranX;
          this.y += ranY;
          this.circle.style.left = `${this.x}px`;
          this.circle.style.top = `${this.y}px`;
        }, 30);
      }
    };

    for (let i = 0; i < 50; i++) {
      let ranX = Math.floor(Math.random() * 300) + 50;
      let ranY = Math.floor(Math.random() * 300) + 50;
      const circle = new Circle(ranX, ranY);
      circle.move();
    }
  </script>
</body>
</html>
