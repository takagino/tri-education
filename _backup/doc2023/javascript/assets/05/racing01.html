<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Racing</title>
  <style>
    #area {
      width: 600px;
      min-height: 100px;
      border-right: 3px solid #f00;
      background-color: #ddd;
    }

    .car {
      width: 100px;
      height: 50px;
      margin-bottom: 20px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
  </style>
</head>

<body>
  <p id="result">勝者は！？</p>
  <button id="start">スタート！</button>
  <div id="area"></div>
  <script>
    class Car {
      constructor(name) {
        this.name = name;
        this.car = document.createElement("p");
        this.car.classList.add("car");
        this.car.textContent = this.name;
        area.appendChild(this.car);

        this.x = 0;
        this.speed = Math.floor(Math.random() * 50) + 50;
      };

      move() {
        this.x += this.speed;
        this.car.style.transform = `translateX(${this.x}px)`;

        if (this.x >= goal) {
          clearTimeout(this.timerId);
          this.car.style.transform = `translateX(${goal}px)`;
          ranking.push(this.name);
          result.textContent = `${ranking[0]}の勝ち!`;
        }
      };

      start() {
        this.timerId = setInterval(() => {
          this.move();
        }, 100);
      };
    };

    const result = document.querySelector('#result');
    const start = document.querySelector('#start');
    const area = document.querySelector('#area');
    const cars = [
      new Car("高木"),
      new Car("河口"),
      new Car("水野"),
    ];
    const goal = 500;
    let ranking = [];

    start.addEventListener('click', () => {
      for (const car of cars) {
        car.start();
      }
    });
  </script>
</body>

</html>
