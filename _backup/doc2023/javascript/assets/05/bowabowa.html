    // timerId = setInterval(() => {

    //     diff = -0.1;

    //   circle.style.transform = `scale(${val})`;

    class Circle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.timerId;
        this.val = 0.8;
        this.diff = 0.1;

        this.circle = document.createElement('div');
        this.circle.classList.add('circle');
        this.circle.style.left = `${this.x}px`;
        this.circle.style.top = `${this.y}px`;
        document.body.append(this.circle);
      }

      move() {
        this.timerId = setInterval(() => {
          if (this.val <= 0.2) {
            this.diff = 0.1;
          }
          if (this.val >= 1) {
            this.diff = -0.1;
          }

          this.val += this.diff;
          this.circle.style.transform = `scale(${this.val})`;
        }, 30);
      }
    }

    for (let i = 0; i < 50; i++) {
      let ranX = Math.floor(Math.random() * 300) + 50;
      let ranY = Math.floor(Math.random() * 300) + 50;

      const circle = new Circle(ranX, ranY);
      circle.move();
    }
  </script>
