<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神経衰弱</title>
  <style>
    body {
      background: #efdec1;
      font-size: 14px;
      font-family: Verdana, sans-serif;
    }

    .container {
      width: 400px;
      margin: 8px auto;
      background: #fff;
      border-radius: 4px;
      padding: 16px;
      text-align: center;
    }

    #card {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
    }

    #card li {
      width: 80px;
      height: 80px;
      border: 1px solid #fff;
      color: #fff;
      font-size: 0;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-sizing: border-box;
      position: relative;
      background: #000;
    }

    #card li:hover {
      opacity: 0.5;
    }

    #btn {
      display: block;
      background: #3498db;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      box-shadow: 0 4px 0 #2880b9;
    }

    .inactive {
      opacity: 0.5;
    }

    #card .inactive {
      font-size: 18px;
    }
  </style>
</head>

<body>
  <section class="container">
    <p id="result">Click to START!</p>
    <ul id="card">
    </ul>
    <button id="btn">START</button>
  </section>

  <script>
    class Number {
      constructor(num) {
        this.num = num;
        this.li = document.createElement('li');
        this.li.textContent = this.num;
        this.li.addEventListener('click', () => {
          this.click();
        });

        card.appendChild(this.li);
      }

      click() {
        if (this.li.classList.contains('inactive') || numSelect.length >= 2) {
          return;
        }

        this.li.classList.add('inactive')
        numSelect.push(this.li);

        if (numSelect.length >= 2) {
          setTimeout(() => {
            numSelect[0].classList.remove('inactive');
            numSelect[1].classList.remove('inactive');

            this.check();

            numSelect = [];
          }, 300);
        }
      }

      check() {
        if (numSelect[0].textContent === numSelect[1].textContent) {
          numSelect[0].classList.add('inactive');
          numSelect[1].classList.add('inactive');
          numCurrent++;
          result.textContent = `${numCurrent} / ${numLength / 2}`;

          if (numCurrent === numLength / 2) {
            const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(2);
            result.textContent = `Finished! ${elapsedTime} seconds!`;
            btn.classList.remove('inactive');
            numCurrent = 0;
          }
        }
      }
    };

    const numLength = 20;
    let numArr = [];
    let numCurrent = 0;
    let numSelect = [];
    let startTime;

    for (let i = 1; i <= numLength; i++) {
      numArr.push(i % (numLength / 2));
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[j], arr[i]] = [arr[i], arr[j]];
      }
      return arr;
    }

    const card = document.querySelector('#card');
    const result = document.querySelector('#result');
    const btn = document.querySelector('#btn');

    btn.addEventListener('click', () => {
      if (btn.classList.contains('inactive')) {
        return;
      }
      btn.classList.add('inactive');
      startTime = Date.now();
      result.textContent = `${numCurrent} / ${numLength / 2}`;

      while (card.firstChild) {
        card.removeChild(card.firstChild);
      }

      const shuffledNumber = shuffle([...numArr]);
      for (let i = 0; i < numLength; i++) {
        new Number(shuffledNumber[i]);
      }
    });
  </script>
</body>

</html>
