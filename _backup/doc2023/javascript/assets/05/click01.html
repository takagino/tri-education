<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実践その1</title>
  <style>
  </style>
</head>
<body>
  <script>
    class Button {
      constructor() {
        this.num = 0;

        this.btn = document.createElement("button");
        this.btn.textContent = this.num;
        this.btn.addEventListener('click', () => {
          this.num++;
          this.btn.textContent = this.num;
        });
        document.body.appendChild(this.btn);
      }
    };

    new Button();
    new Button();
    new Button();
  </script>
</body>
</html>
