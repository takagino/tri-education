<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number</title>
  <style>
    body {
      background: #efdec1;
      font-size: 14px;
      font-family: Verdana, sans-serif;
    }

    .container {
      width: 400px;
      margin: 8px auto;
      background: #fff;
      border-radius: 4px;
      padding: 16px;
      text-align: center;
    }

    #card {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
    }

    #card li {
      width: 80px;
      height: 80px;
      border: 1px solid #fff;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-sizing: border-box;
      position: relative;
      background: #000;
    }

    #card li:hover {
      opacity: 0.5;
    }

    #btn {
      display: block;
      background: #3498db;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
    }

    .inactive {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <section class="container">
    <p id="result">Click to START!</p>
    <ul id="card">
    </ul>
    <button id="btn">START</button>
  </section>

  <script>
    class Number {
      constructor(num) {
        this.num = num;
        this.li = document.createElement('li');
        this.li.textContent = this.num;
        this.li.addEventListener('click', () => {
          this.click();
        });

        card.appendChild(this.li);
      }

      click() {
        if (this.li.classList.contains('inactive')) {
          return;
        }

        if (this.num === numCurrent) {
          this.li.classList.add('inactive');
          numCurrent++;
          result.textContent = `${numCurrent - 1} / ${numLength}`;

          if (numCurrent > numLength) {
            btn.classList.remove('inactive');

            const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(2);
            result.textContent = `Finished! ${elapsedTime} seconds!`;
          }
        }
      }
    }

    const numLength = 25;
    let numArr = [];
    let numCurrent = 1;
    let startTime;

    for (let i = 1; i <= numLength; i++) {
      numArr.push(i);
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [arr[j], arr[i]] = [arr[i], arr[j]];
      }
      return arr;
    }

    const card = document.querySelector('#card');
    const result = document.querySelector('#result');

    btn.addEventListener('click', () => {
      if (btn.classList.contains('inactive')) {
        return;
      }
      btn.classList.add('inactive');

      startTime = Date.now();

      numCurrent = 1;
      result.textContent = `${numCurrent - 1} / ${numLength}`;

      while (card.firstChild) {
        card.removeChild(card.firstChild);
      }

      const shuffledNumber = shuffle([...numArr]);
      for (let i = 0; i < numLength; i++) {
        new Number(shuffledNumber[i]);
      }
    });
  </script>
</body>
</html>
