<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリックゲーム</title>
    <style>
        dl {
            text-align: center;
        }

        dd {
            margin: 0;
        }

        .name {
            margin-bottom: 1em;
            font-weight: bold;
        }

        .pic {
            cursor: pointer;
        }

        .hp {
            margin-top: .5em;
            font-style: oblique;
        }

        body {
            text-align: center;
        }
    </style>
</head>

<body>
    <dl>
        <dt class="name">名前</dt>
        <dd><img class="pic" src="https://trident.takagino.net/doc2023/javascript/assets/03/click/images/slime.png"
                alt="" width="200"></dd>
        <dd class="hp">HP:0</dd>
    </dl>
    <p>プレイヤー</p>
    <p class="ap">AP:0</p>
    <p class="hp_p">HP:0</p>
    <button class="kick">蹴る 消費0</button>
    <button class="punch">殴る　消費1</button><br>
    <button>恫喝　消費2</button>
    <button>自己回復　消費3</button>
    <script>
        const monsters = [
            {
                name: "スライム",
                pic: "https://trident.takagino.net/doc2023/javascript/assets/03/click/images/slime.png",
                hp: 4,
                atk: 1
            },
            {
                name: "目玉",
                pic: "https://trident.takagino.net/doc2023/javascript/assets/03/click/images/eye.png",
                hp: 6,
                atk: 2
            },
            {
                name: "半魚人",
                pic: "https://trident.takagino.net/doc2023/javascript/assets/03/click/images/fish.png",
                hp: 8,
                atk: 3
            },
            {
                name: "笛吹き",
                pic: "https://3.bp.blogspot.com/-dBypBsPFmRI/VD3SbJKl-EI/AAAAAAAAoT8/5gH-Rwqdme4/s800/suisougaku_flute_man.png",
                hp: 9,
                atk: 4
            },
            {
                name: "剣士",
                pic: "https://1.bp.blogspot.com/-rzRcgoXDqEg/YAOTCKoCpPI/AAAAAAABdOI/5Bl3_zhOxm07TUGzW8_83cXMOT9yy1VJwCNcBGAsYHQ/s1041/onepiece02_zoro_bandana.png",
                hp: 10,
                atk: 5
            }
        ];

        const pic = document.querySelector('.pic');
        const name = document.querySelector('.name');
        const hp = document.querySelector('.hp');
        const act = document.querySelectorAll("button");
        const apv = document.querySelector(".ap")
        const p_hpv = document.querySelector(".hp_p")

        let currentHp;
        let currentatk
        let currentMonster = 0;
        let ap = 30;
        let p_hp = 50;
        apv.textContent = `AP:${ap}`
        p_hpv.textContent = `HP:${p_hp}`
        function arrayShuffle(array) {
            for (let i = (array.length - 1); 0 < i; i--) {
                let r = Math.floor(Math.random() * (i + 1));
                let tmp = array[i];
                array[i] = array[r];
                array[r] = tmp;
            }
            return array;
        }

        arrayShuffle(monsters)

        const setMonster = () => {
            pic.src = monsters[currentMonster].pic;
            name.textContent = monsters[currentMonster].name;
            hp.textContent = `HP:${monsters[currentMonster].hp}`;
            currentHp = monsters[currentMonster].hp;
            currentatk = monsters[currentMonster].atk
        };

        setMonster();

        for (let i = 0; i <= act.length; i++) {

            act[i].addEventListener('click', () => {
                if (i < ap && p_hp > 0) {
                    switch (i) {
                        case 0:
                            currentHp--;
                            ap--
                            break
                        case 1:
                            currentHp -= 2;
                            ap -= 1;
                            break
                        case 2:
                            currentHp -= 3;
                            ap -= 2
                            break
                        case 3:
                            p_hp += 8;
                            ap -= 3
                    }
                    p_hp -= currentatk
                    hp.textContent = `HP:${currentHp}`;
                    apv.textContent = `AP:${ap}`
                    p_hpv.textContent = `HP${p_hp}`

                    if (p_hp <= 0) {
                        p_hpv.textContent = "敗北"
                    }

                    if (currentHp <= 0) {
                        currentMonster++;

                        //if文に修正
                        if (currentMonster >= monsters.length) {
                            hp.textContent = `クリア！`;
                        } else {
                            setMonster();
                        }
                    }
                }
            });
        }


    </script>
</body>

</html>
