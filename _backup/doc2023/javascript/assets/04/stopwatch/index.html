<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Stopwatch</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      background: #eee;
    }

    .container {
      margin: 20px auto;
      width: 270px;
      background: #fff;
      padding: 15px;
      text-align: center;
    }

    #timer {
      background: #ddd;
      height: 120px;
      line-height: 120px;
      font-size: 40px;
      margin-bottom: 15px;
    }

    .btn {
      width: 80px;
      height: 45px;
      line-height: 45px;
      background: #ddd;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
    }

    .inactive {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="timer">00:00.000</div>
    <div class="controls">
      <div class="btn" id="start">Start</div>
      <div class="btn" id="stop">Stop</div>
      <div class="btn" id="reset">Reset</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
