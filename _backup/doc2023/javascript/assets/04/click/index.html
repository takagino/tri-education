<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickGame</title>
    <style>
        body {
            padding-top: 40px;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        #area {
            width: 500px;
            height: 500px;
            margin: 0 auto;
            background-color: #ddd;
            position: relative;
        }

        #btn {
            margin-top: 30px;
            padding: 10px 20px;
            border: none;
            background: #000;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .target {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #000;
            position: absolute;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <p id="result"></p>
    <div id="area"></div>
    <button id="btn">Click to start!</button>

    <script src="app.js"></script>
</body>

</html>
