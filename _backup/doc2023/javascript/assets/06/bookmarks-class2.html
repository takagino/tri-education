<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark</title>
  <style>
    ul {
      padding-left: 0;
      list-style: none;
    }
  </style>
</head>

<body>
  <form name="bookmark">
    <div>
      <label>タイトル:<input type="text" id="title" name="title"></label>
    </div>
    <div>
      <label>URL:<input type="url" id="url" name="url"></label>
    </div>
  </form>
  <button id="add">追加</button>
  <button id="delete">削除</button>
  <ul id="list">
    <!-- <li><a href="https://computer.trident.ac.jp/">https://computer.trident.ac.jp/</a></li> -->
  </ul>

  <script>
    class Bookmark {
      //引数を増やす
      constructor(url, title) {
        this.url = url;
        this.title = title;
        this.li = document.createElement('li');
        let a = document.createElement('a');
        a.href = this.url;
        a.target = "_blank";
        a.textContent = this.url;
        this.li.append(a);
        list.append(this.li);
      }
    }

    let bookmarks = [];
    const titleField = document.querySelector('#title'); //タイトルのフィールドを取得
    const urlField = document.querySelector('#url');
    const list = document.querySelector('#list');
    const addBtn = document.querySelector('#add');
    const deleteBtn = document.querySelector('#delete');

    addBtn.addEventListener('click', () => {
      let urlValue = urlField.value;
      let titleValue = titleField.value; //タイトルのフールドの値を取得

      //早期リターンの条件追加
      if (urlValue === "" || titleValue === "" || (!urlValue.startsWith('http://') && !urlValue.startsWith('https://'))) {
        return;
      }

      //引数に渡す値を増やす
      bookmarks.push(new Bookmark(urlValue, titleValue));

      let encodeObj = encodeURIComponent(JSON.stringify(bookmarks));
      localStorage.setItem('obj', encodeObj);
    });

    deleteBtn.addEventListener('click', () => {
      localStorage.removeItem('obj');
      while (list.firstChild) {
        list.removeChild(list.firstChild);
      }
      bookmarks = [];
    });

    window.addEventListener('DOMContentLoaded', () => {
      let val = decodeURIComponent(localStorage.getItem('obj'));

      if (val === "null") {
        return;
      }

      bookmarks = JSON.parse(val);

      for (const obj of bookmarks) {
        //引数に渡す値を増やす
        new Bookmark(obj.url, obj.title);
      }
    });
  </script>
</body>
</html>
