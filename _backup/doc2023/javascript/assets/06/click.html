<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クリック</title>
</head>
<body>
  <p>経過時間：<span id="time"></span></p>
  <button id="add">クリック!</button>
  <button id="retry">もう一回</button>
  <p>クリック数：<span id="val"></span></p>
  <p>最高点：<span id="max"></span></p>
  <script>
    const time = document.querySelector('#time');
    const add = document.querySelector('#add');
    const retry = document.querySelector('#retry');
    const val = document.querySelector('#val');
    const max = document.querySelector('#max');
    let count = 0;
    let keika = 0;
    let timer;
    let isActive = false;

    time.textContent = keika;
    val.textContent = count;

    let score = localStorage.getItem('score');
    if (score > 0) {
      max.textContent = score;
    } else {
      score = 0;
      max.textContent = score;
    }

    add.addEventListener('click', () => {
      if (keika < 5) {
        val.textContent = ++count;
      }

      if (!isActive) {
        isActive = true;
        timer = setInterval(() => {
          time.textContent = ++keika;
          if (keika >= 5) {
            clearInterval(timer);
            time.textContent = "終了";
            if (count > score) {
              localStorage.setItem('score', count);
              max.textContent = count;
            }
          }
        }, 1000);
      }
    });

    retry.addEventListener('click', () => {
      clearInterval(timer);
      isActive = false;
      count = 0;
      keika = 0;
      time.textContent = keika;
      val.textContent = count;
    });

  </script>
</body>
</html>
