<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像</title>
  <style>
    ul {
      padding: 0;
      list-style: none;
      display: flex;
    }
  </style>
</head>
<body>
  <p><img id="main" src="" alt=""></p>
  <ul>
    <li><img class="img" src="https://pbs.twimg.com/profile_images/586384081287430144/LouzVl8p_400x400.jpg" alt=""></li>
    <li><img class="img" src="https://pbs.twimg.com/profile_images/722363923496701952/Y9bx23jv_400x400.jpg" alt=""></li>
    <li><img class="img" src="https://d30e4zemf07u60.cloudfront.net/event_image/4/1546962.jpg" alt=""></li>
  </ul>
  <script>
    const main = document.querySelector('#main');
    const imgs = document.querySelectorAll('.img');
    let src = decodeURIComponent(localStorage.getItem('src'));
    main.src = src;

    for (const img of imgs) {
      img.addEventListener('click', () => {
        main.src = img.src;
        localStorage.setItem('src', encodeURIComponent(img.src));
      });
    }
  </script>
</body>
</html>
