<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビンゴマシーン</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css">
  <style>
    .wrapper {
      width: 90%;
      max-width: 400px;
      margin: 3em auto;
      text-align: center;
    }

    .result {
      margin-top: 1em;
      font-size: 4em;
      font-weight: bold;
    }

    .history {
      margin-top: 2em;
      padding-top: 1em;
      border-top: 1px solid;
      font-size: 2em;
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <div class="btn">
      <button class="start">START</button>
      <button class="stop">STOP</button>
      <button class="reset">RESET</button>
    </div>
    <p class="result">0</p>
    <p class="history"></p>
  </div>
  <script>
    const start = document.querySelector('.start');
    const stop = document.querySelector('.stop');
    const reset = document.querySelector('.reset');
    const result = document.querySelector('.result');
    const history = document.querySelector('.history');
    const numbers = [];
    let setNumbers = [];
    let randomNumbers = [];
    let historyNumbers = [];
    const total = 75;
    let flag = true;
    let count = 0;
    let timer;

    for (let i = 1; i <= total; i++) {
      numbers.push(i);
    };
    setNumbers = [...numbers];

    const shuffle = (array) => {
      for (let i = array.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      };
      return array;
    };

    randomNumbers = shuffle(setNumbers);

    start.addEventListener('click', () => {
      if (flag && randomNumbers.length > 0) {
        flag = false;
        clearInterval(timer);
        timer = setInterval(() => {
          count++;
          if (count > randomNumbers.length - 1) {
            count = 0;
          };
          result.textContent = randomNumbers[count];
        }, 30);
      };
    });

    stop.addEventListener('click', () => {
      if (!flag) {
        flag = true;
        clearInterval(timer);
        const cut = randomNumbers.splice(count, 1);
        historyNumbers.push(cut);

        count = 0;
        history.textContent = "";

        for (const number of historyNumbers) {
          history.textContent += `${number}, `;
        };
      };
    });

    reset.addEventListener('click', () => {
      flag = true;
      count = 0;
      clearInterval(timer);
      setNumbers = [...numbers];
      randomNumbers = shuffle(setNumbers);
      historyNumbers = [];
      result.textContent = 0;
      history.textContent = "";
    });
  </script>
</body>
</html>
