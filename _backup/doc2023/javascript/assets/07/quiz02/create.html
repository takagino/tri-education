<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問題を作る | 三択クイズ</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css">
  <style>
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    dl {
      margin-bottom: 1.5em;
    }

    dt {
      margin-bottom: .5em;
      font-weight: bold;
    }

    .container {
      width: 86%;
      max-width: 800px;
      margin: 3em auto;
    }

    textarea {
      width: 100%;
      padding: .2em .5em;
    }

    input {
      width: 50%;
      margin-bottom: .5em;
      padding: .2em .5em;
    }

    button {
      margin-bottom: .5em;
      padding: .2em 1em;
    }

    #msg {
      display: none;
      color: #f00;
      font-size: 14px;
    }

    .link {
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form">
      <dl>
        <dt>【問題】</dt>
        <dd><textarea name="q" id="q" rows="4"></textarea></dd>
      </dl>
      <dl>
        <dt>【正解】</dt>
        <dd><input type="text" id="a"></dd>
      </dl>
      <button id="r">登録</button>
      <p id="msg">登録が完了しました。</p>
    </div>
    <ul class="link">
      <li><a href="./index.html">回答ページへ</a></li>
    </ul>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyCkUKZMaNfuLkzsp1tJKOSeraCFMIt_zZ8",
      authDomain: "test-f409a.firebaseapp.com",
      projectId: "test-f409a",
      storageBucket: "test-f409a.appspot.com",
      messagingSenderId: "792442032377",
      appId: "1:792442032377:web:acf53bb803f06c268ad228"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const q = document.querySelector('#q');
    const a = document.querySelector('#a');
    const r = document.querySelector('#r');
    const msg = document.querySelector('#msg');

    r.addEventListener('click', async () => {
      if (q.value == '' || a.value == '') {
        return;
      }

      const colRef = collection(db, "quiz2");
      const data = {
        q: q.value,
        a: a.value,
      }
      await addDoc(colRef, data);

      msg.style.display = 'block';
      setTimeout(() => {
        msg.style.display = 'none';
        q.value = a.value = '';
      }, 1000);
    });
  </script>
</body>
</html>
