<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クリック Level.2 | JavaScript実習</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css">
  <style>
    .wrapper {
      width: 90%;
      max-width: 400px;
      margin: 3em auto;
      text-align: center;
    }

    .result {
      margin-top: .5em;
      font-size: 2em;
      font-weight: bold;
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <dl>
      <dt><button class="btn">CLICK</button></dt>
      <dd class="result">0</dd>
    </dl>
  </div>
  <script>
    const btn = document.querySelector('.btn');
    const result = document.querySelector('.result');
    let count = 0;

    btn.addEventListener('mousedown', () => {
      result.textContent = ++count;
      if (count == 20) {
        result.textContent = "おつかれ！";
      }
    });
  </script>
</body>
</html>
