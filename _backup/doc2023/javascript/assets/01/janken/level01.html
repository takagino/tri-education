<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>じゃんけん Level.1 | JavaScript実習</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css">
  <style>
    .wrapper {
      width: 90%;
      max-width: 500px;
      margin: 3em auto;
      text-align: center;
    }

    .btn {
      margin-bottom: 2em;
    }

    .play {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    dl {
      width: 30%;
    }

    dt {
      margin-bottom: .5em;
    }

    .result {
      font-weight: bold;
      color: #f36;
    }

    .player,
    .enemy {
      aspect-ratio: 1;
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <div class="btn">
      <button class="gu">グー</button>
      <button class="choki">チョキ</button>
      <button class="pa">パー</button>
    </div>
    <div class="play">
      <dl>
        <dt>自分</dt>
        <dd><img class="player" src="./images/janken_gu.png" alt=""></dd>
      </dl>
      <dl>
        <dt class="result">結果</dt>
        <dd class="record">0連勝</dd>
      </dl>
      <dl>
        <dt>相手</dt>
        <dd><img class="enemy" src="./images/janken_gu.png" alt=""></dd>
      </dl>
    </div>
  </div>
  <script>
    const items = ["gu", "choki", "pa"];
    const btn = document.querySelectorAll('button');
    const player = document.querySelector('.player');
    const enemy = document.querySelector('.enemy');
    const result = document.querySelector('.result');
    const record = document.querySelector('.record');
    let count = 0;

    for (let i = 0; i < btn.length; i++) {
      btn[i].addEventListener('click', (e) => {
        let type = e.target.className;
        player.setAttribute('src', `./images/janken_${type}.png`);

        let random = Math.floor(Math.random() * 3);
        enemy.setAttribute('src', `./images/janken_${items[random]}.png`);

        if (type == items[random]) {
          result.textContent = "あいこ";
        } else if (type == "gu" && items[random] == "choki") {
          result.textContent = "勝ち！";
          count++;
        } else if (type == "choki" && items[random] == "pa") {
          result.textContent = "勝ち！";
          count++;
        } else if (type == "pa" && items[random] == "gu") {
          result.textContent = "勝ち！";
          count++;
        } else {
          result.textContent = "負け...";
          count = 0;
        };

        record.textContent = `${count}連勝`;
      });
    }
  </script>
</body>
</html>
