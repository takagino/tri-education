<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フォーム | vue.js</title>
  <style>
    [v-cloak] {
      display: none;
    }

    em {
      font-size: 2em;
      font-style: normal;
      font-weight: bold;
    }

  </style>
</head>
<body>
  <div id="app">
    <form>
      <input type="email" v-model.trim="email">
    </form>
    <p v-cloak>確認：<em>{{ email }}</em></p>
  </div>

  <script src="https://unpkg.com/vue@next"></script>
  <script>
    const app = Vue.createApp({
      setup() {
        const email = Vue.ref();

        return {
          email
        }
      }
    });

    app.mount("#app");
  </script>
</body>
</html>
