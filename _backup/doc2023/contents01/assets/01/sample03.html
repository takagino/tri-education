<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>応用問題03</title>
</head>
<body>
  <div id="app">
    <p :style="{'background-color':col}">{{ col }}</p>
    <button @click="colSet('#f00')">赤</button>
    <button @click="colSet('#0f0')">緑</button>
    <button @click="colSet('#00f')">青</button>
  </div>

  <script src="https://unpkg.com/vue@next"></script>
  <script>
    const app = Vue.createApp({
      setup() {
        const col = Vue.ref("#fff");

        const colSet = (color) => {
          col.value = color;
        };

        return {
          col,
          colSet
        }
      }
    });

    app.mount("#app");
  </script>
</body>
</html>
