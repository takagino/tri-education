<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webデザイン学科</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css">
  <style>
    .wrapper {
      max-width: 1200px;
      width: 88%;
      margin: 6em auto;
    }

    h1 {
      width: fit-content;
      margin: auto;
      padding: .3em .5em;
      border-radius: 20px;
      background-color: #028482;
      color: #fff;
    }

    h2 {
      margin-bottom: 2em;
      font-size: 2em;
      text-align: center;
    }

    h3 {
      margin-bottom: .5em;
      color: #028482;
    }

    header {
      margin-bottom: 10em;
      text-align: center;
    }

    .header__lead {
      margin: .5em 0 2em;
      font-size: 1.5em;
      font-weight: bold;
    }

    .feature {
      margin-bottom: 10em;
    }

    .feature__item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4em;
    }

    .feature__item:nth-child(2n+1) {
      flex-direction: row-reverse;
    }

    .feature__pic {
      width: 50%;
    }

    .feature__text {
      width: 46%;
      font-size: 1.5em;
      font-weight: bold;
    }

    .specialty__list {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .specialty__item {
      width: 30%;
    }

    .specialty__pic {
      margin-bottom: 1em;
    }

    footer {
      margin-top: 10em;
      padding-top: 3em;
      border-top: 1px solid #028482;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>Webデザイン学科</h1>
      <p class="header__lead">見る者を魅きつけるWebページを作ろう！</p>
      <img src="https://computer.trident.ac.jp/courses/web_design/images/img_main.jpg" alt="">
    </header>

    <main>
      <section class="feature">
        <h2>学科の特徴</h2>
        <div class="feature__list">
          <article class="feature__item">
            <div class="feature__pic">
              <img src="https://computer.trident.ac.jp/courses/web_design/images/img_point_01.jpg" alt="">
            </div>
            <div class="feature__text">
              <h3>POINT 01</h3>
              <p>デザイン+プログラミング<br>
            両方の知識を身につける！</p>
            </div>
          </article>
          <article class="feature__item">
            <div class="feature__pic">
              <img src="https://computer.trident.ac.jp/courses/web_design/images/img_point_02.jpg" alt="">
            </div>
            <div class="feature__text">
              <h3>POINT 02</h3>
              <p>インターンシップと産学協同制作で<br>
              現場の感覚を身につける!</p>
            </div>
          </article>
          <article class="feature__item">
            <div class="feature__pic">
              <img src="https://computer.trident.ac.jp/courses/web_design/images/img_point_03.jpg" alt="">
            </div>
            <div class="feature__text">
              <h3>POINT 03</h3>
              <p>MacBook Air無料貸し出し！<br>
            安心の学習環境！</p>
            </div>
          </article>
        </div>
      </section>

      <section class="specialty">
        <h2>トライデントだからできる専門的な学び</h2>
        <div class="specialty__list">
          <article class="specialty__item">
            <img class="specialty__pic" src="https://computer.trident.ac.jp/courses/web_design/images/img_box_01.jpg" alt="">
            <h3>Webデザイン</h3>
            <p>使う人のことを考えた、わかりやすいホームページ制作</p>
          </article>
          <article class="specialty__item">
            <img class="specialty__pic" src="https://computer.trident.ac.jp/courses/web_design/images/img_box_03.jpg" alt="">
            <h3>Webプログラミング</h3>
            <p>幅広く生かせるワンランク上の技術を</p>
          </article>
          <article class="specialty__item">
            <img class="specialty__pic" src="https://computer.trident.ac.jp/courses/web_design/images/img_box_04.jpg" alt="">
            <h3>マーケティング・ディレクション</h3>
            <p>成功するサイト、人気のサイトを分析、提案</p>
          </article>
        </div>
      </section>
    </main>

    <footer>
      <small>&copy; takagi.</small>
    </footer>
  </div>
</body>
</html>
