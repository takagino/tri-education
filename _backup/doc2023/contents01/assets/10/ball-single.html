<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳ね返るボール1つ</title>
  <style>
    canvas {
      background: #ddd;
      border: 1px solid #aaa;
    }
  </style>
</head>
<body>
  <canvas id='example' width='640' height='480'>
    Canvas not supported.
  </canvas>

  <script>
    let canvas, ctx;
    const param = {
      x: 320,
      y: 320,
      speedX: Math.random() * 8 - 4,
      speedY: Math.random() * 8 - 4,
      size: Math.random() * 8 + 1,
      color: `rgb(${Math.random() * 255},${Math.random() * 255},${Math.random() * 255})`
    };

    window.addEventListener('load', () => {
      init();
    });

    const init = () => {
      canvas = document.querySelector('#example');
      if (!canvas || !canvas.getContext) {
        return false;
      }
      ctx = canvas.getContext('2d');

      window.requestAnimationFrame(draw);
    }

    const draw = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      //値の更新
      param.x += param.speedX;
      param.y += param.speedY;

      //壁ではねかえる
      if (param.x < 0 || param.x > canvas.width) {
        param.speedX *= -1.0;
      }
      if (param.y < 0 || param.y > canvas.height) {
        param.speedY *= -1.0;
      }

      //円の描画
      ctx.fillStyle = param.color;
      ctx.beginPath();
      ctx.arc(param.x, param.y, param.size, 0, Math.PI * 2, true);
      ctx.fill();

      window.requestAnimationFrame(draw);
    }
  </script>
</body>
</html>
