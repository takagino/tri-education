<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳ね返るボール</title>

  <style>
    body {
      margin: 0;
    }

    canvas {
      background: #fff;
    }
  </style>
</head>

<body>
  <canvas id='example' width='640' height='480'>
    Canvas not supported.
  </canvas>

  <script>
    let canvas, ctx;
    const num = 100;
    let array = [];
    let flag = false;

    window.addEventListener('load', () => {
      init();
    });

    window.addEventListener('resize', () => {
      resize();
    });


    const init = () => {
      canvas = document.querySelector('#example');
      if (!canvas || !canvas.getContext) {
        return false;
      }
      ctx = canvas.getContext('2d');

      resize();

      array.push({
        x: canvas.width / 2,
        y: canvas.height / 2,
        speedX: Math.random() * 8 - 4,
        speedY: Math.random() * 8 - 4,
        size: Math.random() * 8 + 1,
        color: `rgb(${Math.random() * 255},${Math.random() * 255},${Math.random() * 255})`
      });

      canvas.addEventListener('mousedown', () => {
        flag = true;
      });

      canvas.addEventListener('mouseup', () => {
        flag = false;
      });

      canvas.addEventListener('mouseleave', () => {
        flag = false;
      });

      window.addEventListener('keyup', (e) => {
        if (e.keyCode === 32) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          array = [];
          array.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            speedX: Math.random() * 8 - 4,
            speedY: Math.random() * 8 - 4,
            size: Math.random() * 8 + 1,
            color: `rgb(${Math.random() * 255},${Math.random() * 255},${Math.random() * 255})`
          });
        }
      });

      window.requestAnimationFrame(draw);
    }

    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    const draw = () => {
      ctx.fillStyle = 'rgb(255,255,255,0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < array.length; i++) {
        array[i].x += array[i].speedX;
        array[i].y += array[i].speedY;

        if (array[i].x < 0 || array[i].x > canvas.width) {
          array[i].speedX *= -1.0;

          array.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            speedX: Math.random() * 8 - 4,
            speedY: Math.random() * 8 - 4,
            size: Math.random() * 8 + 1,
            color: `rgb(${Math.random() * 255},${Math.random() * 255},${Math.random() * 255})`
          });

          if (array.length >= num) {
            array.shift();
          }
        }
        if (array[i].y < 0 || array[i].y > canvas.height) {
          array[i].speedY *= -1.0;

          array.push({
            x: canvas.width / 2,
            y: canvas.height / 2,
            speedX: Math.random() * 8 - 4,
            speedY: Math.random() * 8 - 4,
            size: Math.random() * 8 + 1,
            color: `rgb(${Math.random() * 255},${Math.random() * 255},${Math.random() * 255})`
          });

          if (array.length >= num) {
            array.shift();
          }
        }

        ctx.fillStyle = array[i].color;
        ctx.beginPath();
        ctx.arc(array[i].x, array[i].y, array[i].size, 0, Math.PI * 2, true);
        ctx.fill();
      }

      window.requestAnimationFrame(draw);
    };
  </script>
</body>
</html>
