<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>p5.js</title>
  <style>
    canvas {
      background-color: #ddd;
      border: 1px solid #aaa;
    }
  </style>
</head>

<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.min.js"></script>
  <script>
    let obj = {
      x: 0,
      y: 0,
      c: 0,
      r: 0,
      s: 0
    };

    function setup() {
      createCanvas(640, 480);
      rectMode(CENTER);
      colorMode(HSL);
      noStroke();
      fill(180, 50, 50, 0.5);
    }

    function draw() {
      //clear();

      obj.x++;
      obj.r++;

      push();
      translate(320, 240);
      rotate(obj.r);
      ellipse(obj.x, 0, 20, 20);
      pop();
    }
  </script>
</body>
</html>
