<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>並べる</title>
  <style>
    canvas {
      background: #ddd;
      border: 1px solid #aaa;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.min.js"></script>
  <script>
    let seed;
    const obj = {
      d: 20
    };

    function setup() {
      createCanvas(640, 480);
      colorMode(HSL);
      rectMode(CENTER);
      noStroke();
      seed = floor(random(9999));
    }

    function draw() {
      clear();
      randomSeed(seed);
      for (let y = 0; y < height; y += obj.d) {
        for (let x = 0; x < width; x += obj.d) {
          fill(floor(random(360)), 50, 50);
          let dd = dist(x + obj.d / 2, y + obj.d / 2, mouseX, mouseY) * 0.05;
          ellipse(x + obj.d / 2, y + obj.d / 2, dd, dd);
        }
      }
    }
  </script>
</body>
</html>
