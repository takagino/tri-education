<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {

            background-image: conic-gradient(from 20deg, rgba(223, 168, 168, 1) 18deg, rgba(193, 199, 197, 1) 68deg, rgba(108, 199, 221, 1) 151deg, rgba(177, 151, 223, 1) 263deg, rgba(122, 197, 216, 1) 295deg, rgba(223, 168, 168, 1) 360deg);
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/addons/p5.sound.min.js"></script>
    <script>

        let mySound;
        let fft;

        function preload() {
            mySound = loadSound('126_BPM142.mp3');
        }

        function setup() {
            createCanvas(640, 480);
            colorMode(HSL);
            angleMode(DEGREES);
            stroke(300, 60, 50, 1);

            fft = new p5.FFT();
        }


        function draw() {
            clear();
            mySound.amp(map(mouseY, 0, height, 0, 1));

            if (mySound.isPlaying()) {
                let spectrum = fft.analyze();
                console.log(spectrum);
                let angle = 540 / spectrum.length;

                push();
                translate(width / 2, height / 1);
                for (let i = 0; i < spectrum.length; i++) {
                    rotate(angle);
                    let h = map(spectrum[i], min(spectrum), max(spectrum), 0, height / 0.8);
                    line(0, 0, 0, h);
                }
                pop();
            }
        }

        function keyPressed() {
            mySound.loop();
        }

        function keyReleased() {
            mySound.pause();
        }

    </script>
</body>

</html>
