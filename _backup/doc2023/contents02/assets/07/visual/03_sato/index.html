<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {
            background: #f66;
            border: 1px solid #aaaaaa;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/addons/p5.sound.min.js"></script>
    <script>
        let mySound;
        let fft;

        //事前にファイルを読み込む
        function preload() {
            mySound = loadSound('1d.mp3');
        }

        function setup() {
            createCanvas(640, 480);
            colorMode(HSL);
            rectMode(CENTER);
            angleMode(DEGREES);
            stroke(255);
            fft = new p5.FFT();
        }

        // map(spectrum[i], min(spectrum), max(spectrum), 0, 360)

        function draw() {
            clear();

            mySound.amp(map(mouseY, 0, height, 0, 1));

            if (mySound.isPlaying()) {
                let spectrum = fft.analyze();
                console.log(spectrum);
                let angle = 3600 / spectrum.length;

                push();
                translate(width / 2, height / 2);
                for (let i = 0; i < spectrum.length; i++) {
                    rotate(angle);
                    let h = map(spectrum[i], min(spectrum), max(spectrum), 0, height / 2);
                    line(5, h, 0, h);
                }
                pop();
            }
        }

        function keyPressed() {
            mySound.play(); //ループ再生したい場合は「loop()」
        }

        function keyReleased() {
            mySound.pause();; //一時停止は「pause()」
        }
    </script>
</body>

</html>
