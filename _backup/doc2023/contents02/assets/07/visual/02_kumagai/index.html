<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.sound</title>
  <style>
    canvas {
        background: gray;
        border: 1px solid #aaa;
    }
  </style>
</head>
<body>
  <!-- <p>http://classical-sound.seesaa.net/article/298320039.html</p> -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/addons/p5.sound.min.js"></script>
  <script>
let mySound;
let fft;

function preload() {
  mySound = loadSound('igotrhythm.mp3');
}

    function setup() {
      createCanvas(640, 480);
      colorMode(HSL);
      rectMode(CENTER);
      noStroke();

      fft = new p5.FFT();

    }

    function draw() {
      clear();
      randomSeed(1); // 数字は何でも良い

      mySound.amp(map(mouseY, 0, height, 0, 1));
      if (mySound.isPlaying()) {
        let waveform = fft.waveform();
        console.log(waveform);

    //可視化
    for (let i = 0; i < waveform.length; i++) {
      let x = map(i, 0, waveform.length, 0, width);
      let y = 400;
      fill(60,100,50);
      let h = -height + map(waveform[i], -1, 1, 0, height);
      ellipse(320, 240, h/2, h/2);
      fill(0,0,0);
      ellipse(305, 215, h/15, h/15);
      ellipse(335, 215, h/15, h/15);
      ellipse(320, 260, h/6, h/6);

    }
      }
    }

    function keyPressed() {
      mySound.loop();
    }

    function keyReleased() {
      mySound.pause();
    }
  </script>
</body>
</html>
