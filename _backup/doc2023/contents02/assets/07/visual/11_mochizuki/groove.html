<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {
            background-image: url(./maxresdefault.jpg);
            background-repeat: no-repeat;
            opacity: 0.5;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/addons/p5.sound.min.js"></script>
    <script>
        let mySound;
        let fft;

        function preload() {
            mySound = loadSound('Doja_Cat_-_Boss_Bitch_CeeNaija.com_.mp3');
        }

        function setup() {
            createCanvas(640, 480);
            colorMode(HSL);
            noStroke();

            fft = new p5.FFT();
        }

        function draw() {
            clear();
            mySound.amp(map(mouseY, 0, height, 0, 1));
            noFill();

            //     if (mySound.isPlaying()) {
            //         let waveform = fft.waveform();
            //         console.log(waveform);

            //         //可視化
            //         for (let i = 0; i < waveform.length; i++) {
            //             let x = map(i, 0, waveform.length, 0, width);
            //             let h = -height + map(waveform[i], -1, 1, 0, height);
            //             rect(x, height, width / waveform.length, h);
            //         }
            //     }
            // }
            if (mySound.isPlaying()) {
                let spectrum = fft.analyze();
                let angle = 10 / spectrum.length;


                push();
                translate(width / 2, height / 2);

                beginShape();

                stroke(random(255), random(255), random(255));

                for (let i = -10; i < spectrum.length; i++) {
                    let h = map(spectrum[i], min(spectrum), max(spectrum), 0, height / 2);
                    let sx = cos(angle * i + 70) * h;
                    let sy = sin(angle * i + 70) * h;
                    vertex(sx, sy);
                    ellipse(sx, sy, 5, 2);
                }

                endShape(CLOSE);
            }
        }


        function keyPressed() {
            mySound.loop();
        }

        function keyReleased() {
            mySound.pause();
        }
    </script>
</body>

</html>
