<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {
            background: #ddd;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>
    <p id="sound-text"></p>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/addons/p5.sound.min.js"></script>
    <script>
        let osc;
        const melody = [261, 293, 329, 349, 391, 440, 493, 523]; //ドレミファソラシド
        const tone = ["ド", "レ", "ミ", "ファ", "ソ", "ラ", "シ", "ド"];

        function setup() {
            createCanvas(640, 480);
            colorMode(HSL);
            rectMode(CENTER);
            frameRate(8);
            osc = new p5.Oscillator();
            osc.setType('sin');
        }

        function draw() {
            let num = floor(random(melody.length));
            osc.freq(random(melody[num]));
        }

        function keyPressed() {
            osc.start();
        }

        function keyReleased() {
            osc.stop();
        }
    </script>
</body>

</html>
