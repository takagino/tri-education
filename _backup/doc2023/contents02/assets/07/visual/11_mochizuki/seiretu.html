<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.sound</title>
    <style>
        canvas {
            background: #ddd;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/addons/p5.sound.min.js"></script>

    <script>
        const obj = {
            d: 20
        };

        function setup() {
            createCanvas(640, 480);
            colorMode(HSL);
            noStroke();
            fill(180, 50, 50);

            for (let y = 0; y < height; y += obj.d) {
                for (let x = 0; x < width; x += obj.d) {
                    fill(floor(random(360)), 50, 50);
                    obj.dd = floor(random(5, obj.d));
                    let ran = floor(random(2));
                    if (ran == 0) {
                        ellipse(x + obj.d / 2, y + obj.d / 2, obj.dd, obj.dd);
                    } else {
                        rect(x + obj.d / 2, y + obj.d / 2, obj.dd, obj.dd);
                    }
                }
            }
        }

        function draw() {
        }

    </script>

</body>

</html>
