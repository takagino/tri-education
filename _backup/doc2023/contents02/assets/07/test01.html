<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>p5.js</title>
  <style>
    canvas {
      background: #ddd;
      border: 1px solid #aaa;
    }

  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.5.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.5.0/addons/p5.sound.js"></script>
  <script>
    let mySound;
    let fft;

    function preload() {
      mySound = loadSound('power.mp3');
    }

    function setup() {
      createCanvas(640, 480);
      colorMode(HSL);
      noStroke();

      fft = new p5.FFT();
    }

    function draw() {
      clear();
      mySound.amp(map(mouseY, 0, height, 0, 1));

      if (mySound.isPlaying()) {
        let spectrum = fft.waveform();
        console.log(spectrum);

        for (let i = 0; i < spectrum.length; i++) {
          let x = map(i, 0, spectrum.length, 0, width);
          let h = -height + map(spectrum[i], -1, 1, 0, height);
          rect(x, height, width / spectrum.length, h);
        }
      }
    }

    function keyPressed() {
      mySound.loop();
    }

    function keyReleased() {
      mySound.pause();
    }
  </script>
</body>
</html>
