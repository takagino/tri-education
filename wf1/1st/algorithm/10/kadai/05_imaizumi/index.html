<html lang="ja">

<head>
    <meta charset="UTF-8" />

            border: 1px solid;

        body {
            display: flex;

            font-size: 18px;
        }

    <div class="sousa">
        ＜操作方法＞<br>
        spaceキー : ジャンプ / 左右キー : 移動<br>

        <br>
        ゲーム途中にescapeキーを押すとタイトル画面に戻れます
    </div>
