<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newslly</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/destyle.css/destyle.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="header">
        <div class="header__inner">
            <h1 class="header__logo">
                <img src="./images/img_logo.png" alt="Newslly">
            </h1>
        </div>
    </header>

    <main class="main">
        <section class="news">
            <div class="news__inner">
                <h2 class="news__title">MORE NEWS</h2>
                <div class="news__list">
                    <article class="news__item post">
                        <p class="post__category">TRAVEL</p>
                        <h3 class="post__title">Subtitle</h3>
                        <div class="post__content">
                            <p>Lorem ipsum dolor sit amet, in eam odio amet, vix id nullam
                                detracto, vidit vituperatoribus duo id. Affert detraxit
                                voluptatum vis eu, inermis eloquentiam.</p>
                        </div>
                        <p class="time">2m ago</p>
                    </article>
                </div>
            </div>
        </section>
        <section class="trending">
            <div class="trending__inner">
                <h2 class="trending__title">TRENDING</h2>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__inner">
            <p class="footer__copyright">
                <small>TRIDENT college All Rights Reserved.</small>
            </p>
        </div>
    </footer>
</body>
</html>
