<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単元2: DOMの取得と要素の書き換え</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- defer属性をつけてHTML解析完了後に安全にJSを実行 -->
  <script defer src="js/main.js"></script>
</head>
<body>
  <main class="container">
    <div class="card">
      <h1 id="theme-title">JavaScriptで画面を動かそう</h1>
      <p id="theme-desc">下のボタンを押して、メッセージやテーマカラーを切り替えてみてください。</p>

      <div class="btn-group">
        <button id="btn-light" type="button">☀️ ライト</button>
        <button id="btn-dark" type="button">🌙 ダーク</button>
        <button id="btn-ocean" type="button">🌊 オーシャン</button>
      </div>
    </div>
  </main>
</body>
</html>
