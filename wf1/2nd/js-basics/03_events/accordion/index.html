<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アコーディオン</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
</head>
<body>
    <div class="accordion">
        <div class="accordion-item">
            <button id="accordion-btn" class="accordion-btn">
                Q. 支払いはクレジットカードに対応していますか？
                <span class="icon">+</span>
            </button>
            <div id="accordion-content" class="accordion-content">
                <p>はい、主要なクレジットカード（Visa, MasterCard, JCBなど）に対応しております。</p>
            </div>
        </div>
    </div>
</body>
</html>
