<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04_HTML属性の操作</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/main.js"></script>
</head>

<body>
  <div class="container">
    <h1 id="main-title">HTML属性の操作</h1>

    <!-- 1. 画像切り替えエリア（練習4で使用） -->
    <section class="section">
      <h2 class="section-title">画像の切り替え（src / alt）</h2>
      <div class="image-box">
        <img id="view-img" src="https://picsum.photos/id/1015/500/300" alt="昼の山の風景">
        <div>
          <button id="toggle-img-btn" class="btn">昼 / 夜を切り替える</button>
        </div>
      </div>
    </section>

    <!-- 2. リンク切り替えエリア（練習5で使用） -->
    <section class="section">
      <h2 class="section-title">リンク先の切り替え（href / target）</h2>
      <div class="link-switch-box">
        <p>目的のサイトを選択してください：</p>
        <button id="switch-site-btn" class="btn">公式サイトへ切り替え</button>
        <div class="link-wrapper">
          <a id="external-link" href="https://google.com" target="_blank" class="external-link">Googleを開く（新しいタブ）</a>
        </div>
      </div>
    </section>
  </div>
</body>

</html>
