<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>季節の寄せ植えガーデニング講習会</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="site-name">みどりのまちづくり推進協会</div>
  </header>
  <main>
    <h1>初心者向け 季節の寄せ植えガーデニング講習会</h1>

    <h2>講習会の内容</h2>
    <p>季節の草花を使った美しい寄せ植えの基本から、長く咲かせるための水やりや日々のお手入れ方法までを実習形式で学びます。</p>

    <h2>当日の実習ステップ</h2>
    <ol>
      <li>鉢底石と培養土の準備</li>
      <li>植物の配置バランス確認</li>
      <li>苗の植え込みと土入れ</li>
      <li>たっぷりの水やりと仕上げ</li>
    </ol>

    <h2>参加時の持ち物</h2>
    <ul>
      <li>エプロンまたは汚れてもよい服装</li>
      <li>園芸用グローブ（軍手でも可）</li>
      <li>お持ち帰り用の大きめの袋</li>
    </ul>
  </main>
</body>
</html>
