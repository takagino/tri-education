  <div id="container">
    <h1>美味しいハンドドリップコーヒーの淹れ方</h1>
    <p>コーヒーの味わいは、豆の挽き目や湯温、そしてお湯を注ぐスピードによって大きく変化します。</p>
    <h2>抽出時に意識したい3つのポイント</h2>
    <p>新鮮な豆を計量し、90度前後のお湯で最初に30秒ほど蒸らすことで、豊かな香りとコクをしっかりと引き出すことができます。</p>
  </div>
