<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

<body>
  <header>
    <div class="site-name">中央地区 防災対策協議会</div>
  </header>
  <main>
    <h1>地域総合防災訓練・避難体験デイのご案内</h1>

    <h2>訓練の目的</h2>
    <p>災害発生時の初期対応や安全な避難経路の確認、応急手当の基本を地域住民の皆さまと実践的に確認することを目的としています。</p>

    <h2>当日の訓練プログラム</h2>
    <ol>
      <li>避難受付および班分け確認</li>
      <li>初期消火と消火器の操作体験</li>
      <li>応急手当とAEDの使用実習</li>
      <li>非常食の試食と備蓄品展示</li>
    </ol>

    <h2>参加時の服装・持ち物</h2>
    <ul>
      <li>動きやすい服装と履き慣れた運動靴</li>
      <li>飲み物（水分補給用）</li>
      <li>タオルおよび筆記用具</li>
    </ul>
  </main>
