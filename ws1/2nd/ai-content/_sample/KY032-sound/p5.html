<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>TTP223B Web Serial Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
        }
    </style>
    <!-- p5.js と p5.webserial のCDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://unpkg.com/@gohai/p5.webserial@^1/libraries/p5.webserial.js"></script>
    <script>
        let port;
        let connectBtn;

        let targetVol = 0;
        let easedVol = 0;
        let rippleHistory = []; // 音に反応して広がる波紋の配列

        function setup() {
            createCanvas(windowWidth, windowHeight);

            port = createSerial();

            connectBtn = createButton('Arduinoに接続');
            connectBtn.position(16, 16);
            connectBtn.mousePressed(connectBtnClick);
        }

        function draw() {
            background(18, 18, 22, 40); // 半透明背景で残像効果（トレイル）

            // 接続されたらボタンの表示を変更して無効化
            if (port.opened() && !connectBtn.elt.disabled) {
                connectBtn.html('接続中...');
                connectBtn.attribute('disabled', '');
            }


            // シリアルデータ受信
            let str = port.readUntil('\n');
            if (str.length > 0) {
                let val = parseInt(str.trim(), 10);
                if (!isNaN(val)) {
                    targetVol = val;

                    // 一定以上の音量スパイクで波紋オブジェクトを生成
                    if (val > 80) {
                        rippleHistory.push({
                            radius: 40,
                            alpha: 255,
                            colorHue: map(val, 80, 500, 180, 360) // 音の大きさで青→赤へ変化
                        });
                    }
                }
            }

            // Lerpで音量を滑らかに追従
            easedVol = lerp(easedVol, targetVol, 0.2);

            translate(width / 2, height / 2);

            // 波紋の描画と更新
            colorMode(HSB, 360, 100, 100, 255);
            noFill();
            for (let i = rippleHistory.length - 1; i >= 0; i--) {
                let r = rippleHistory[i];
                stroke(r.colorHue, 80, 100, r.alpha);
                strokeWeight(3);
                circle(0, 0, r.radius);

                r.radius += 6;
                r.alpha -= 5;

                // 透明になったら破棄
                if (r.alpha <= 0) {
                    rippleHistory.splice(i, 1);
                }
            }

            // 中心コアの描画
            let baseRadius = 60 + easedVol * 0.8;
            let coreHue = map(easedVol, 0, 400, 180, 360);
            fill(coreHue, 90, 100);
            noStroke();
            circle(0, 0, baseRadius);

            // ステータス表示
            resetMatrix();
            colorMode(RGB, 255);
            fill(160);
            textSize(13);
            textAlign(LEFT, BASELINE);
            text(`Raw Amp: ${targetVol} | Eased: ${Math.round(easedVol)}`, 16, height - 16);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        function connectBtnClick() {
            if (!port.opened()) {
                port.open('Arduino', 9600);
            } else {
                port.close();
            }
        }
    </script>
</head>

<body>
</body>

</html>
