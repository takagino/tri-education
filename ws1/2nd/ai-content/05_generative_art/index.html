<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>p5.js × センサー：ジェネラティブ・ハブ</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #030307;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* 上部フロートUIヘッダー */
    #ui-container {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 18, 28, 0.75);
      padding: 10px 18px;
      border-radius: 40px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    button {
      background: linear-gradient(135deg, #00d26a, #00994d);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 16px rgba(0, 210, 106, 0.5);
    }
    button:disabled {
      background: #333842;
      color: #888;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    select {
      background: rgba(30, 36, 52, 0.9);
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 204, 0.3);
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border 0.2s;
    }
    select:hover {
      border-color: #00ffcc;
    }

    .status-text {
      font-size: 12px;
      color: #8f9bb3;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-text span {
      color: #00ffcc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
    }
    .hint-text {
      color: #636e7b;
      font-size: 11px;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- コントロールUI -->
  <div id="ui-container">
    <button id="connect-btn">🔌 Arduinoと接続</button>

    <!-- リアルタイム・テンプレート切替セレクト -->
    <select id="art-select">
      <option value="simple">🔰【ハンズオン】基本パルス (Simple)</option>
      <option value="medusa" selected>① 深海の発光生物 (Medusa)</option>
      <option value="mandala">② 幾何学曼荼羅 (Mandala)</option>
      <option value="flow">③ オーロラ流線群 (Flow)</option>
      <option value="bloom">④ デジタル開花 (Bloom)</option>
      <option value="cosmic">⑤ コズミック・星雲 (Cosmic)</option>
    </select>
    <div class="status-text">
      センサー値: <span id="sensor-val">0.00</span> | 生値: <span id="raw-val">---</span>
    </div>

    <div class="hint-text">
      ※未接続時は「マウス移動」でシミュレート可
    </div>
  </div>

  <!-- 1. p5.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>

  <!-- 2. センサー通信・値加工モジュール（独立部品） -->
  <script src="js/sensor.js"></script>

  <!-- 3. 各アートクラス（テンプレート群）の読み込み -->
  <script src="js/templates/SimplePulseArt.js"></script>
  <script src="js/templates/MedusaArt.js"></script>
  <script src="js/templates/MandalaArt.js"></script>
  <script src="js/templates/FlowFieldArt.js"></script>
  <script src="js/templates/BotanicalBloomArt.js"></script>
  <script src="js/templates/CosmicMeshArt.js"></script>

  <!-- 4. ハブ（アート選択・パラメータ調整・p5.jsメインループ） -->
  <script src="js/sketch.js"></script>

  <!-- 5. テンプレート切替イベント -->
  <script>
    const artSelect = document.getElementById('art-select');
    if (artSelect) {
      artSelect.addEventListener('change', (e) => {
        initArt(e.target.value);
      });
    }
  </script>
</body>
</html>
