<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07: Eclipse Striker - ゲームとセンサー連携</title>

    <!-- ① p5.js 本体 (v1.11系) -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.4/lib/p5.min.js"></script>

    <!-- ② 物理演算エンジン Planck.js (p5playの直前に必須) -->

    <!-- ③ p5play v3 本体 -->
    <script src="https://p5play.org/v3/p5play.js"></script>

    <!-- ④ センサー通信モジュール -->
    <script src="js/sensor.js"></script>

    <!-- ⑤ ゲーム本体スケッチ -->
    <script src="js/sketch.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d0e17;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        canvas {
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
        }

        .guide-bar {
            position: absolute;
            bottom: 12px;
            font-size: 13px;
            color: #747d8c;
            display: flex;
            gap: 20px;
        }

        .guide-bar span {
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 10px;
            border-radius: 4px;
            color: #ced6e0;
        }

</head>

<body>
    <div class="guide-bar">
        <span>🕹️ 移動: スティック / 矢印キー</span>
        <span>⚡ 射撃: オート連射</span>

    </div>
</body>

</html>
